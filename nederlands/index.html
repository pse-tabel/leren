<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070d">
<meta name="description" content="Gevorderde woordenschat Nederlands: betekenis, synoniemen en het woord in een zin.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Woordkracht">
<title>Woordkracht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#06070d; --ink2:#0a0c16; --surface:#10131f; --surface2:#171b2b;
  --line:#242a44; --line2:#333b60;
  --text:#e2e6f5; --muted:#848ba8; --muted2:#5c6382;
  --ok:#31ffb0; --bad:#ff3d5e;
  --ned:#4ade80; --ned2:#38bdf8; --ned3:#c084fc;
  --fd:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --fu:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  --sp:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink); color:var(--text); font-family:var(--fu); min-height:100dvh;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; overflow-x:hidden}
[hidden]{display:none!important}
button{font-family:inherit}
.glow{position:fixed; inset:-28% -20% auto -20%; height:70vh; z-index:0; pointer-events:none;
  background:radial-gradient(42% 38% at 26% 22%, color-mix(in srgb,var(--c,var(--ned)) 18%,transparent) 0%, transparent 70%),
             radial-gradient(34% 30% at 78% 8%, color-mix(in srgb,var(--ned3) 12%,transparent) 0%, transparent 70%);
  filter:blur(34px); transition:background .5s var(--sp)}
.statusbar{position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top); z-index:20;
  pointer-events:none; background:color-mix(in srgb,var(--ink) 78%,transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
.app{position:relative; z-index:1; max-width:560px; margin:0 auto; min-height:100dvh;
  display:flex; flex-direction:column; gap:14px;
  padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));}

.top{display:flex; align-items:center; gap:10px}
.terug{width:40px; height:40px; flex:none; display:grid; place-items:center; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:18px;
  text-decoration:none; transition:.2s var(--sp)}
.terug:hover{color:var(--ned); border-color:color-mix(in srgb,var(--ned) 50%,transparent)}
.mark{width:40px; height:40px; flex:none; display:grid; place-items:center; border-radius:12px;
  border:1px solid color-mix(in srgb,var(--ned) 45%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--ned) 18%,var(--surface)),var(--surface));
  box-shadow:0 0 18px -6px var(--ned);
  font-family:var(--fd); font-weight:700; font-size:16px; color:var(--ned)}
.tt{flex:1; min-width:0}
.tt h1{font-family:var(--fd); font-size:21px; font-weight:700; margin:0; line-height:1.1}
.tt p{margin:2px 0 0; font-family:var(--fm); font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted2)}
.gear{width:40px; height:40px; flex:none; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); color:var(--muted); font-size:16px; cursor:pointer}
.gear[aria-expanded="true"]{color:var(--ned); border-color:color-mix(in srgb,var(--ned) 50%,transparent)}

.tabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:1px 16px 3px;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 30px),transparent);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 30px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; font-size:13px; font-weight:600; padding:8px 13px; border-radius:99px;
  border:1px solid var(--line); background:var(--ink2); color:var(--muted); cursor:pointer;
  transition:.22s var(--sp); white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--ink); background:var(--text); border-color:var(--text)}

.panel{display:grid; gap:12px; padding:14px; border-radius:14px; border:1px solid var(--line);
  background:var(--ink2)}
.fset{display:grid; gap:7px}
.flabel{font-family:var(--fm); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted2)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:12px; font-weight:600; padding:7px 11px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); color:var(--muted); cursor:pointer; transition:.2s var(--sp)}
.chip[aria-pressed="true"]{color:var(--ned); border-color:color-mix(in srgb,var(--ned) 55%,transparent);
  background:color-mix(in srgb,var(--ned) 13%,var(--surface))}
.reset{justify-self:start; font-size:12px; color:var(--bad); background:transparent;
  border:1px solid color-mix(in srgb,var(--bad) 35%,transparent); border-radius:9px;
  padding:7px 12px; cursor:pointer}

.view{display:flex; flex-direction:column; gap:13px; flex:1}
.view.in{animation:vin .34s var(--sp) both}
@keyframes vin{from{opacity:0; transform:translateY(9px)}to{opacity:1; transform:none}}
.meta{display:flex; align-items:center; justify-content:space-between; gap:10px}
.counter{font-family:var(--fm); font-size:11px; color:var(--muted2); letter-spacing:.08em}
.counter b{color:var(--text)}
.mini{font-size:12px; color:var(--muted); background:transparent; border:1px solid var(--line);
  border-radius:8px; padding:6px 10px; cursor:pointer}
.mini:hover{color:var(--text)}
.track{height:4px; border-radius:99px; background:var(--surface); overflow:hidden}
.bar{height:100%; width:0; border-radius:99px; background:var(--c,var(--ned));
  box-shadow:0 0 12px -2px var(--c,var(--ned)); transition:width .3s var(--sp)}

.tegel{border-radius:16px; padding:22px 18px; border:1px solid color-mix(in srgb,var(--c,var(--ned)) 32%,transparent);
  background:linear-gradient(158deg,color-mix(in srgb,var(--c,var(--ned)) 10%,var(--surface)) 0%,var(--surface) 62%,var(--ink2) 100%);
  box-shadow:0 22px 50px -34px var(--c,var(--ned)); display:grid; gap:9px; text-align:center}
.badge{font-family:var(--fm); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--muted2)}
.woord{font-family:var(--fd); font-size:clamp(28px,7.5vw,40px); font-weight:700; line-height:1.1;
  color:var(--c,var(--ned)); word-break:break-word}
.onder{font-size:13px; color:var(--muted); line-height:1.5}
.soortje{font-family:var(--fm); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted2)}
.vraag{margin:0; text-align:center; font-family:var(--fm); font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted2)}

.zinvak{border-radius:14px; padding:18px 16px; border:1px solid var(--line); background:var(--ink2);
  font-size:17px; line-height:1.65; text-align:center}
.gat{display:inline-block; min-width:96px; border-bottom:2px solid var(--c,var(--ned));
  color:var(--c,var(--ned)); font-weight:700; padding:0 6px}
.gat.leeg{color:var(--muted2)}

.opts{display:grid; gap:9px}
.opt{text-align:left; font-size:14.5px; font-weight:600; padding:13px 15px; border-radius:12px;
  border:1px solid var(--line); background:var(--ink2); color:var(--text); cursor:pointer;
  transition:.18s var(--sp); display:flex; gap:11px; align-items:center}
.opt:hover:not(:disabled){border-color:var(--line2); background:var(--surface)}
.opt i{flex:none; width:22px; height:22px; border-radius:7px; display:grid; place-items:center;
  font-style:normal; font-family:var(--fm); font-size:11px; color:var(--muted2);
  border:1px solid var(--line)}
.opt.good{border-color:color-mix(in srgb,var(--ok) 55%,transparent);
  background:color-mix(in srgb,var(--ok) 12%,var(--ink2)); color:var(--ok)}
.opt.wrong{border-color:color-mix(in srgb,var(--bad) 55%,transparent);
  background:color-mix(in srgb,var(--bad) 12%,var(--ink2)); color:var(--bad)}

.typewrap{display:grid; gap:9px}
.typewrap input{width:100%; font-family:var(--fu); font-size:16px; padding:13px 15px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); color:var(--text)}
.typewrap input:focus{outline:none; border-color:var(--c,var(--ned))}
.typewrap input.goed{border-color:var(--ok); color:var(--ok)}
.typewrap input.fout{border-color:var(--bad); color:var(--bad)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn{font-size:14px; font-weight:700; padding:13px; border-radius:11px; border:0; cursor:pointer;
  color:var(--ink); background:var(--c,var(--ned)); transition:transform .16s var(--sp)}
.btn:active{transform:scale(.98)}
.linkbtn{font-size:12.5px; color:var(--muted2); background:transparent; border:0; cursor:pointer;
  text-decoration:underline; padding:4px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:9px}

.fb{display:grid; gap:9px; padding:15px; border-radius:13px; border:1px solid var(--line);
  background:var(--ink2)}
.fb.g{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.b{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.fbt{font-family:var(--fd); font-size:17px; font-weight:700}
.fb.g .fbt{color:var(--ok)} .fb.b .fbt{color:var(--bad)}
.fbs{font-size:13.5px; color:var(--muted); line-height:1.6}
.fbs b{color:var(--text)}

/* kaarten */
.kaartwrap{flex:1; min-height:260px; max-height:min(58dvh,460px); display:grid; touch-action:pan-y}
.kaart{position:relative; width:100%; height:100%; min-height:260px; transform-style:preserve-3d;
  transition:transform .55s var(--sp); cursor:pointer}
.kaart.om{transform:rotateY(180deg)}
.vlak{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:18px; padding:22px; display:flex; flex-direction:column; justify-content:center;
  gap:11px; text-align:center; overflow:hidden;
  border:1px solid color-mix(in srgb,var(--c,var(--ned)) 30%,transparent);
  background:linear-gradient(158deg,color-mix(in srgb,var(--c,var(--ned)) 9%,var(--surface)) 0%,var(--surface) 60%,var(--ink2) 100%);
  box-shadow:0 24px 56px -34px var(--c,var(--ned))}
.vlak.b{transform:rotateY(180deg)}
.vlak .groot{font-family:var(--fd); font-size:clamp(26px,7vw,38px); font-weight:700; line-height:1.15;
  color:var(--c,var(--ned))}
.vlak .uitleg{font-size:15px; color:var(--text); line-height:1.55}
.vlak .synrij{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.vlak .synrij span{font-size:12px; color:var(--muted); border:1px solid var(--line);
  border-radius:7px; padding:4px 9px}
.hint{margin:0; text-align:center; font-size:11.5px; color:var(--muted2)}

/* matchen */
.mgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:7px}
.mt{font-size:12.5px; font-weight:600; padding:12px 8px; border-radius:10px; border:1px solid var(--line);
  background:var(--ink2); color:var(--text); cursor:pointer; min-height:62px; line-height:1.35;
  transition:.16s var(--sp)}
.mt.sel{border-color:var(--ned); box-shadow:0 0 18px -8px var(--ned)}
.mt.weg{opacity:0; pointer-events:none}

/* voortgang */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stat{padding:13px 10px; border-radius:12px; border:1px solid var(--line); background:var(--ink2);
  text-align:center}
.stat b{display:block; font-family:var(--fd); font-size:22px; font-weight:700}
.stat span{font-family:var(--fm); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted2)}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:6px}
.pcel{height:34px; border-radius:8px; border:1px solid var(--line); background:var(--ink2);
  display:grid; place-items:center; font-size:9.5px; color:var(--muted2); overflow:hidden;
  position:relative}
.pcel i{position:absolute; inset:auto 0 0 0; background:var(--ned); opacity:.55}
.pcel span{position:relative; z-index:1; padding:0 3px; text-align:center; line-height:1.1;
  word-break:break-word}

/* samenvatting */
.slijst{display:grid; gap:12px}
.svak{border:1px solid var(--line); border-radius:13px; overflow:hidden; background:var(--ink2)}
.skop{padding:11px 14px; background:color-mix(in srgb,var(--c,var(--ned)) 10%,transparent);
  border-bottom:1px solid var(--line); display:flex; justify-content:space-between;
  align-items:baseline; gap:10px}
.skop b{font-family:var(--fd); font-size:15px; font-weight:700}
.skop span{font-family:var(--fm); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted2)}
.srij{padding:11px 14px; border-bottom:1px solid var(--line); display:grid; gap:4px}
.srij:last-child{border-bottom:0}
.srij .w{font-weight:700; font-size:14.5px; color:var(--c,var(--ned))}
.srij .w em{font-style:normal; font-family:var(--fm); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted2); margin-left:7px}
.srij .b{font-size:13.5px; color:var(--text); line-height:1.5}
.srij .s{font-size:12.5px; color:var(--muted)}
.srij .z{font-size:12.5px; color:var(--muted2); font-style:italic}

@media (min-width:660px){
  .app{max-width:720px; padding-left:26px; padding-right:26px}
  .tabs{flex-wrap:wrap; overflow:visible; margin:0; padding:0; -webkit-mask-image:none; mask-image:none}
  .opts{grid-template-columns:1fr 1fr}
  .mgrid{grid-template-columns:repeat(4,1fr)}
  .kaartwrap{min-height:300px}
  .kaart{min-height:300px}
}
/* ---------- op een groot scherm: zijbalk in plaats van de tabrij ---------- */
@media (min-width:980px){
  .app{max-width:1080px; display:grid; gap:16px 30px;
    grid-template-columns:262px minmax(0,1fr);
    grid-template-rows:auto auto auto 1fr;
    grid-template-areas:"kop kop" "nav hoofd" "pan hoofd" "vul hoofd";
    padding:28px 32px calc(30px + env(safe-area-inset-bottom))}
  .top{grid-area:kop; padding-bottom:11px; border-bottom:1px solid var(--line)}
  .tabs{grid-area:nav; flex-direction:column; gap:4px; align-self:start; overflow:visible;
    margin:0; padding:0; -webkit-mask-image:none; mask-image:none}
  .panel{grid-area:pan}
  .view{grid-area:hoofd; min-width:0}
  .tab{width:100%; text-align:left; border-radius:10px; padding:11px 14px; font-size:14px;
    background:transparent; border-color:transparent; white-space:normal}
  .tab:hover{background:var(--ink2)}
  .tab[aria-selected="true"]{background:var(--surface); border-color:var(--line2); color:var(--text)}
  .tt h1{font-size:26px}
  .kaartwrap{min-height:380px; max-height:min(56dvh,470px)}
  .opts{grid-template-columns:1fr 1fr}
  .mgrid{grid-template-columns:repeat(4,1fr)}
  #svBody>div{grid-template-columns:1fr 1fr; align-items:start}
}
@media print{
  .glow,.statusbar,.tabs,.panel,.top .terug,.top .gear,.meta{display:none!important}
  body{background:#fff; color:#000}
  .app{max-width:none; padding:0}
  .svak{break-inside:avoid; border:1px solid #bbb; background:#fff; margin:0 0 10px}
  .skop{background:#f2f2f2}
  .srij .w{color:#000}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important; transition-duration:.01ms!important}}

var GROEPEN=[{"naam": "groep 21", "aantal": 10}, {"naam": "groep 22", "aantal": 10}, {"naam": "groep 23", "aantal": 10}];

/* ---------- kleine helpers ---------- */
function $(s){return document.querySelector(s)}
function $$(s){return [].slice.call(document.querySelectorAll(s))}
function el(tag,klas,tekst){
  var n=document.createElement(tag);
  if(klas)n.className=klas;
  if(tekst!=null)n.textContent=tekst;
  return n;
}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function kaal(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
}

/* ---------- bewaarde toestand ---------- */
var SLEUTEL="woordkracht-v1";
function standaard(){
  var g={}; GROEPEN.forEach(function(x){g[x.naam]=1});
  return {mode:"kaarten", groepen:g, prog:{}, kOrde:null, kPos:0};
}
var S=standaard();
try{
  var bewaard=localStorage.getItem(SLEUTEL);
  if(bewaard){
    var b=JSON.parse(bewaard);
    for(var k in b)if(k in S)S[k]=b[k];
    GROEPEN.forEach(function(x){if(!(x.naam in S.groepen))S.groepen[x.naam]=1});
  }
}catch(e){}
function save(){try{localStorage.setItem(SLEUTEL,JSON.stringify(S))}catch(e){}}

/* ---------- welke woorden doen mee ---------- */
function pool(){
  var uit=WOORDEN.filter(function(w){return S.groepen[w.groep]});
  return uit.length?uit:WOORDEN;
}
function P(w){
  if(!S.prog[w.woord])S.prog[w.woord]={b:0};
  return S.prog[w.woord];
}
function merk(w,goed){
  var p=P(w);
  p.b=goed?Math.min(5,p.b+1):Math.max(0,p.b-1);
  save();
  if(S.mode==="voortgang")tekenVoortgang();
}
function andere(w,n,veld){
  var rest=shuffle(WOORDEN.filter(function(x){return x.woord!==w.woord}));
  var uit=[], gezien={};
  for(var i=0;i<rest.length&&uit.length<n;i++){
    var v=veld(rest[i]);
    if(!v||gezien[kaal(v)])continue;
    gezien[kaal(v)]=1; uit.push(v);
  }
  return uit;
}
function gloed(kleur){$("#glow").style.setProperty("--c",kleur)}

/* ---------- meerkeuzevraag ---------- */
function meerkeuze(cfg){
  /* cfg: {kop, woord, onder, vraag, juist, fout[], kleur, uitleg, na} */
  var wrap=el("div"); wrap.style.display="grid"; wrag(wrap,cfg.kleur);
  var tg=el("div","tegel"); tg.style.setProperty("--c",cfg.kleur);
  tg.innerHTML='<span class="badge">'+esc(cfg.kop)+'</span>'+
    '<div class="woord">'+esc(cfg.woord)+'</div>'+
    (cfg.onder?'<div class="onder">'+esc(cfg.onder)+'</div>':"");
  wrap.appendChild(tg);
  wrap.appendChild(el("p","vraag",cfg.vraag));

  var opties=shuffle([cfg.juist].concat(cfg.fout));
  var doos=el("div","opts"), af=false;
  opties.forEach(function(o,i){
    var b=el("button","opt"); b.type="button";
    b.appendChild(el("i",null,String.fromCharCode(65+i)));
    b.appendChild(el("span",null,o));
    b.addEventListener("click",function(){
      if(af)return; af=true;
      var goed=o===cfg.juist;
      $$(".opts .opt").forEach(function(x){
        x.disabled=true;
        var t=x.querySelector("span").textContent;
        if(t===cfg.juist)x.classList.add("good");
        else if(x===b)x.classList.add("wrong");
      });
      cfg.na(goed, wrap);
    });
    doos.appendChild(b);
  });
  wrap.appendChild(doos);
  return wrap;
}
function wrag(n,kleur){n.style.gap="13px"; n.style.setProperty("--c",kleur)}
function terugkoppeling(wrap,goed,uitleg,knoptekst,volgende){
  var fb=el("div","fb "+(goed?"g":"b"));
  fb.appendChild(el("div","fbt",goed?"Juist":"Fout"));
  if(uitleg){var u=el("div","fbs"); u.innerHTML=uitleg; fb.appendChild(u)}
  var nx=el("button","btn",knoptekst); nx.type="button";
  nx.addEventListener("click",volgende);
  fb.appendChild(nx);
  wrap.appendChild(fb);
}

/* ---------- kaarten ---------- */
var K={om:false};
function kaartenStart(){
  gloed("var(--ned)");
  var lijst=pool();
  if(!S.kOrde||S.kOrde.length!==lijst.length){
    S.kOrde=shuffle(lijst.map(function(w){return w.woord})); S.kPos=0; save();
  }
  kaartTeken();
}
function huidigeKaart(){
  var lijst=pool();
  var naam=S.kOrde[S.kPos%S.kOrde.length];
  var w=null;
  lijst.forEach(function(x){if(x.woord===naam)w=x});
  return w||lijst[0];
}
function kaartTeken(){
  var wrap=$("#kWrap"); wrap.innerHTML="";
  var w=huidigeKaart();
  $("#kPos").textContent=(S.kPos%S.kOrde.length)+1;
  $("#kTot").textContent=pool().length;
  K.om=false;
  var kaart=el("div","kaart");
  var voor=el("div","vlak");
  voor.appendChild(el("div","groot",w.woord));
  voor.appendChild(el("div","soortje",w.soort));
  var achter=el("div","vlak b");
  achter.appendChild(el("div","uitleg",w.betekenis));
  var syn=el("div","synrij");
  w.syn.forEach(function(s){syn.appendChild(el("span",null,s))});
  achter.appendChild(syn);
  kaart.appendChild(voor); kaart.appendChild(achter);
  kaart.addEventListener("click",function(){
    K.om=!K.om; kaart.classList.toggle("om",K.om);
  });
  wrap.appendChild(kaart);
}
function kaartVolgende(goed){
  merk(huidigeKaart(),goed);
  S.kPos=(S.kPos+1)%S.kOrde.length; save(); kaartTeken();
}
$("#kKen").addEventListener("click",function(){kaartVolgende(true)});
$("#kNog").addEventListener("click",function(){kaartVolgende(false)});
$("#kSchud").addEventListener("click",function(){
  S.kOrde=shuffle(pool().map(function(w){return w.woord})); S.kPos=0; save(); kaartTeken();
});

/* ---------- betekenis ---------- */
var B={n:0,goed:0};
function betekenisStart(){
  gloed("var(--ned)");
  var body=$("#bBody"); body.innerHTML="";
  $("#bPos").textContent=B.n+1; $("#bGoed").textContent=B.goed;
  var lijst=pool(), w=lijst[rnd(lijst.length)];
  body.appendChild(meerkeuze({
    kop:"betekenis", woord:w.woord, onder:w.soort,
    vraag:"Wat betekent dit woord?", kleur:"var(--ned)",
    juist:w.betekenis, fout:andere(w,3,function(x){return x.betekenis}),
    na:function(goed,wrap){
      if(goed)B.goed++;
      merk(w,goed);
      terugkoppeling(wrap,goed,
        "<b>"+esc(w.woord)+"</b> — "+esc(w.betekenis)+
        "<br><span style=\"color:var(--muted2)\">"+esc(w.zin)+"</span>",
        "Volgende", function(){B.n++; betekenisStart()});
    }
  }));
}
$("#bNieuw").addEventListener("click",betekenisStart);

  gloed("var(--ned2)");
  var body=$("#sBody"); body.innerHTML="";
  $("#sPos").textContent=Y.n+1; $("#sGoed").textContent=Y.goed;
  var lijst=pool(), w=lijst[rnd(lijst.length)];
  var juist=w.syn[rnd(w.syn.length)];
  var fout=andere(w,3,function(x){return x.syn[rnd(x.syn.length)]});
  body.appendChild(meerkeuze({
    kop:"synoniem", woord:w.woord, onder:w.soort,
    vraag:"Welk woord betekent ongeveer hetzelfde?", kleur:"var(--ned2)",
    juist:juist, fout:fout,
    na:function(goed,wrap){
      if(goed)Y.goed++;
      merk(w,goed);
      var extra=w.syn.length>1?"Ook goed: "+w.syn.filter(function(s){return s!==juist}).join(", ")+".":"";
      if(w.tegen&&w.tegen.length)extra+=(extra?" ":"")+"Het tegenovergestelde: "+w.tegen.join(", ")+".";
      terugkoppeling(wrap,goed,
        "<b>"+esc(w.woord)+"</b> = "+esc(juist)+(extra?"<br>"+esc(extra):""),
        "Volgende", function(){Y.n++; synoniemStart()});
    }
  }));
}

    var b=el("button","opt"); b.type="button";
    b.appendChild(el("i",null,String.fromCharCode(65+i)));

      merk(w,goed);

        "<b>"+esc(w.woord)+"</b> — "+esc(w.betekenis),

    });
    doos.appendChild(b);
  });
  wrap.appendChild(doos);
  body.appendChild(wrap);
}

  gloed("var(--ned)");
  var body=$("#wBody"); body.innerHTML="";
  $("#wPos").textContent=W2.n+1; $("#wGoed").textContent=W2.goed;
  var lijst=pool(), w=lijst[rnd(lijst.length)];

  var tg=el("div","tegel"); tg.style.setProperty("--c","var(--ned)");

    '<div class="onder" style="font-size:16px; color:var(--text)">'+esc(w.betekenis)+'</div>'+
    '<div class="soortje">'+esc(w.soort)+' · synoniem: '+esc(w.syn[0])+'</div>';
  wrap.appendChild(tg);
  wrap.appendChild(el("p","vraag","Welk woord is dit?"));

  var tw=el("div","typewrap"), af=false;
  var inp=document.createElement("input"); inp.type="text";
  inp.placeholder="het woord"; inp.setAttribute("autocapitalize","off");
  inp.setAttribute("autocorrect","off"); inp.setAttribute("autocomplete","off");
  inp.setAttribute("spellcheck","false"); inp.setAttribute("aria-label","Het woord");
  var go=el("button","btn","Nakijken"); go.type="button";
  var wn=el("button","linkbtn","Weet ik niet"); wn.type="button";
  function toon(goed){
    af=true; inp.disabled=true; go.remove(); wn.remove();
    inp.classList.add(goed?"goed":"fout");
    if(!goed){inp.classList.add("shake"); inp.value=w.woord}
    if(goed)W2.goed++;
    merk(w,goed);
    terugkoppeling(wrap,goed,
      "<b>"+esc(w.woord)+"</b> — "+esc(w.betekenis)+
      "<br><span style=\"color:var(--muted2)\">"+esc(w.zin)+"</span>",
      "Volgende", function(){W2.n++; schrijvenStart()});
  }
  function nakijk(){
    if(af)return;
    var v=inp.value.trim(); if(!v)return;
    toon(kaal(v)===kaal(w.woord));
  }
  go.addEventListener("click",nakijk);
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")nakijk()});
  wn.addEventListener("click",function(){if(!af)toon(false)});
  tw.appendChild(inp); tw.appendChild(go); tw.appendChild(wn);
  wrap.appendChild(tw);
  body.appendChild(wrap);
  setTimeout(function(){inp.focus()},220);
}
$("#wNieuw").addEventListener("click",schrijvenStart);

    tegels.push({sleutel:w.woord, tekst:w.syn[0], soort:"s"});

  var grid=el("div","mgrid");
  shuffle(tegels).forEach(function(t){
    var b=el("button","mt",t.tekst); b.type="button"; b.dataset.k=t.sleutel;
    b.addEventListener("click",function(){
      if(b.classList.contains("weg"))return;
      if(!M.sel){M.sel=b; b.classList.add("sel"); return}
      if(M.sel===b){b.classList.remove("sel"); M.sel=null; return}
      if(M.sel.dataset.k===b.dataset.k){
        var a=M.sel; a.classList.remove("sel");
        a.classList.add("weg"); b.classList.add("weg");
        M.sel=null; M.over--;
        if(!M.over)setTimeout(matchKlaar,350);
      } else {
        b.classList.add("wrong");
        var a2=M.sel; a2.classList.remove("sel");
        setTimeout(function(){b.classList.remove("wrong")},420);
        M.sel=null;
      }
    });
    grid.appendChild(b);
  });
  body.appendChild(grid);
}
function matchKlaar(){
  var body=$("#mBody");
  var fb=el("div","fb g");
  fb.appendChild(el("div","fbt","Alles gekoppeld"));
  fb.appendChild(el("div","fbs","Zes woorden aan hun synoniem. Nog een ronde?"));
  var nx=el("button","btn","Nieuwe ronde"); nx.type="button";
  nx.addEventListener("click",matchenStart);
  fb.appendChild(nx);
  body.appendChild(fb);
}
$("#mNieuw").addEventListener("click",matchenStart);

/* ---------- toets ---------- */
var T={rij:[],i:0,goed:0};
function toetsStart(){
  gloed("var(--ned)");
  var lijst=shuffle(pool()).slice(0,15);
  T.rij=lijst.map(function(w){return {w:w, type:["betekenis","synoniem","zin"][rnd(3)]}});
  T.i=0; T.goed=0;
  $("#tTot").textContent=T.rij.length;
  toetsVraag();
}
function toetsVraag(){
  var body=$("#tBody"); body.innerHTML="";
  $("#tPos").textContent=Math.min(T.i+1,T.rij.length);
  $("#tGoed").textContent=T.goed;
  $("#tBar").style.width=(T.i/T.rij.length*100)+"%";
  if(T.i>=T.rij.length){toetsKlaar(); return}
  var q=T.rij[T.i], w=q.w;

  if(q.type==="zin"){
    var wrap=el("div"); wrag(wrap,"var(--ned3)");
    var vak=el("div","zinvak");
    vak.innerHTML=esc(w.zinVoor)+'<span class="gat leeg" id="tgat">?</span>'+esc(w.zinNa);
    wrap.appendChild(vak);
    wrap.appendChild(el("p","vraag","Welk woord hoort in het gat?"));
    var juist=w.gat, af=false;
    var doos=el("div","opts");
    shuffle([juist].concat(andere(w,3,function(x){return x.gat}))).forEach(function(o,i){
      var b=el("button","opt"); b.type="button";
      b.appendChild(el("i",null,String.fromCharCode(65+i)));
      b.appendChild(el("span",null,o));
      b.addEventListener("click",function(){
        if(af)return; af=true;
        var goed=o===juist;
        document.getElementById("tgat").textContent=juist;
        document.getElementById("tgat").classList.remove("leeg");
        $$("#tBody .opt").forEach(function(x){
          x.disabled=true;
          var t=x.querySelector("span").textContent;
          if(t===juist)x.classList.add("good"); else if(x===b)x.classList.add("wrong");
        });
        if(goed)T.goed++;
        merk(w,goed);
        terugkoppeling(wrap,goed,"<b>"+esc(w.woord)+"</b> — "+esc(w.betekenis),
          "Volgende", function(){T.i++; toetsVraag()});
      });
      doos.appendChild(b);
    });
    wrap.appendChild(doos);
    body.appendChild(wrap);
    return;
  }

  var isBet=q.type==="betekenis";
  var juist2=isBet?w.betekenis:w.syn[rnd(w.syn.length)];
  var fout2=isBet?andere(w,3,function(x){return x.betekenis})
                 :andere(w,3,function(x){return x.syn[rnd(x.syn.length)]});
  body.appendChild(meerkeuze({
    kop:isBet?"betekenis":"synoniem", woord:w.woord, onder:w.soort,
    vraag:isBet?"Wat betekent dit woord?":"Welk woord betekent ongeveer hetzelfde?",
    kleur:isBet?"var(--ned)":"var(--ned2)",
    juist:juist2, fout:fout2,
    na:function(goed,wrap){
      if(goed)T.goed++;
      merk(w,goed);
      terugkoppeling(wrap,goed,"<b>"+esc(w.woord)+"</b> — "+esc(w.betekenis),
        "Volgende", function(){T.i++; toetsVraag()});
    }
  }));
}
function toetsKlaar(){
  var body=$("#tBody");
  $("#tBar").style.width="100%";
  var pct=Math.round(T.goed/T.rij.length*100);
  var fb=el("div","fb "+(pct>=70?"g":"b"));
  fb.appendChild(el("div","fbt",T.goed+" van de "+T.rij.length+" juist"));
  fb.appendChild(el("div","fbs",pct>=90?"Dat zit erin."
    :pct>=70?"Bijna. Neem de fouten nog eens door bij Kaarten."
    :"Nog even oefenen met Betekenis en Synoniemen."));
  var nx=el("button","btn","Nieuwe toets"); nx.type="button";
  nx.addEventListener("click",toetsStart);
  fb.appendChild(nx);
  body.appendChild(fb);
}
$("#tNieuw").addEventListener("click",toetsStart);

/* ---------- voortgang ---------- */
function tekenVoortgang(){
  gloed("var(--ned)");
  var body=$("#vBody"); body.innerHTML="";
  var lijst=pool();
  var vol=0, bezig=0, niet=0;
  lijst.forEach(function(w){
    var b=P(w).b;
    if(b>=5)vol++; else if(b>0)bezig++; else niet++;
  });
  var stats=el("div","stats");
  [[vol,"gekend"],[bezig,"bezig"],[niet,"nog niet"]].forEach(function(p){
    var s=el("div","stat");
    s.appendChild(el("b",null,String(p[0])));
    s.appendChild(el("span",null,p[1]));
    stats.appendChild(s);
  });
  body.appendChild(stats);

  var grid=el("div","pgrid"); grid.style.marginTop="12px";
  lijst.forEach(function(w){
    var c=el("div","pcel");
    var vul=el("i"); vul.style.height=(P(w).b/5*100)+"%";
    c.appendChild(vul);
    c.appendChild(el("span",null,w.woord));
    c.title=w.woord+" — "+P(w).b+"/5";
    grid.appendChild(c);
  });
  body.appendChild(grid);

  var note=el("p","hint","Elk vakje vult zich als je het woord goed beantwoordt. "
    +"Vijf keer goed is vol; fout zet het een stap terug.");
  note.style.marginTop="10px";
  body.appendChild(note);
}

/* ---------- samenvatting ---------- */
function tekenSamenvatting(){
  gloed("var(--ned3)");
  var body=$("#svBody"); body.innerHTML="";
  var lijst=pool();
  $("#svInfo").textContent=lijst.length+" woorden · "+
    GROEPEN.filter(function(g){return S.groepen[g.naam]}).length+" groepen";
  var wrap=el("div","slijst");
  GROEPEN.forEach(function(g){
    if(!S.groepen[g.naam])return;
    var eigen=lijst.filter(function(w){return w.groep===g.naam});
    if(!eigen.length)return;
    var vak=el("div","svak"); vak.style.setProperty("--c","var(--ned)");
    var kop=el("div","skop");
    kop.appendChild(el("b",null,g.naam));
    kop.appendChild(el("span",null,eigen.length+" woorden"));
    vak.appendChild(kop);
    eigen.forEach(function(w){
      var r=el("div","srij");
      var wd=el("div","w",w.woord);
      var em=el("em",null,w.soort); wd.appendChild(em);
      r.appendChild(wd);
      r.appendChild(el("div","b",w.betekenis));
      var s="synoniem: "+w.syn.join(", ");
      if(w.tegen&&w.tegen.length)s+=" · tegenover: "+w.tegen.join(", ");
      r.appendChild(el("div","s",s));
      r.appendChild(el("div","z",w.zin));
      vak.appendChild(r);
    });
    wrap.appendChild(vak);
  });
  body.appendChild(wrap);
}
$("#btnPrint").addEventListener("click",function(){window.print()});

/* ---------- groepen aan en uit ---------- */
function tekenGroepChips(){
  var box=$("#groepChips"); box.innerHTML="";
  GROEPEN.forEach(function(g){
    var b=el("button","chip",g.naam+" ("+g.aantal+")"); b.type="button";
    b.setAttribute("aria-pressed",String(!!S.groepen[g.naam]));
    b.addEventListener("click",function(){
      var aan=!S.groepen[g.naam];
      var n=0; GROEPEN.forEach(function(x){if(S.groepen[x.naam])n++});
      if(!aan&&n<=1)return;            /* minstens één groep blijft aan */
      S.groepen[g.naam]=aan?1:0;
      b.setAttribute("aria-pressed",String(aan));
      S.kOrde=null; save(); zetModus(S.mode);
    });
    box.appendChild(b);
  });
}
$("#gear").addEventListener("click",function(){
  var open=$("#panel").hidden;
  $("#panel").hidden=!open;
  this.setAttribute("aria-expanded",String(open));
});
$("#btnReset").addEventListener("click",function(){
  if(!confirm("Alle voortgang wissen?"))return;
  S.prog={}; save(); zetModus(S.mode);
});

/* ---------- tabbladen ---------- */
var START={kaarten:kaartenStart, betekenis:betekenisStart, synoniem:synoniemStart,
           zin:zinStart, schrijven:schrijvenStart, matchen:matchenStart,
           toets:toetsStart, voortgang:tekenVoortgang, samenvatting:tekenSamenvatting};
function zetModus(m){
  if(!START[m])m="kaarten";
  S.mode=m; save();
  $$(".tab").forEach(function(t){
    t.setAttribute("aria-selected",String(t.dataset.m===m));
  });
  $$(".view").forEach(function(v){
    var aan=v.id==="v-"+m;
    v.hidden=!aan;
    v.classList.toggle("in",aan);
  });
  START[m]();
}
$$(".tab").forEach(function(t){
  t.addEventListener("click",function(){zetModus(t.dataset.m)});
});

/* ---------- start ---------- */
$("#subkop").textContent="Gevorderde woordenschat · "+WOORDEN.length+" woorden";
tekenGroepChips();
zetModus(S.mode&&START[S.mode]?S.mode:"kaarten");
</script>
<!--thema-js-start-->
<script>
/* ---------- themakiezer ---------- */
(function(){
  var NAMEN={"standaard":"Neon", "synthwave":"Synthwave", "neonijs":"Neon ijs", "gifgroen":"Gifgroen", "magenta":"Magenta", "vuur":"Vuur", "terminal":"Terminal", "middernacht":"Middernacht", "leisteen":"Leisteen", "indigo":"Indigo", "indigonacht":"Indigo nacht", "mist":"Mist", "grasgroen":"Grasgroen", "notitieblok":"Notitieblok", "sepia":"Sepia", "zonsopgang":"Zonsopgang"};
  var balk=document.getElementById("themabalk");
  if(!balk)return;
  var knoppen=[].slice.call(balk.querySelectorAll(".themaknop"));
  var naamvak=document.getElementById("themanaam");

  function huidig(){
    try{return localStorage.getItem("leren-thema")||"standaard"}catch(e){return "standaard"}
  }
  function toon(t){
    if(t==="standaard")document.documentElement.removeAttribute("data-thema");
    else document.documentElement.setAttribute("data-thema",t);
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta){
      var kleur=getComputedStyle(document.documentElement)
        .getPropertyValue("--ink").trim();
      if(kleur)meta.setAttribute("content",kleur);
    }
    knoppen.forEach(function(b){
      b.setAttribute("aria-pressed",String(b.dataset.thema===t));
    });
    if(naamvak)naamvak.textContent=NAMEN[t]||"";
  }
  function kies(t){
    try{localStorage.setItem("leren-thema",t)}catch(e){}
    toon(t);
  }
  knoppen.forEach(function(b){
    b.addEventListener("click",function(){kies(b.dataset.thema)});
  });
  /* een andere tab of app in dezelfde map heeft het thema gewijzigd */
  window.addEventListener("storage",function(e){
    if(e.key==="leren-thema")toon(huidig());
  });
  toon(huidig());
})();
</script>
<!--thema-js-eind-->
