<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Parabolenladder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: sticky ladder of numbered rungs on the left, one lesson or exercise column on the right.
   Graph-paper blue ink on a cool paper ground; the orange dot is always the top of a parabola. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f4f7fc; --ink:#14203a; --muted:#56637e; --line:#d3dcec;
  --accent:#2547d0; --accent-ink:#ffffff; --accent-soft:#e3e9fb; --accent-line:#b9c6f2;
  --curve:#2547d0; --mark:#e8590c;
  --ok:#16794c; --ok-soft:#dff3e8; --bad:#b3261e; --bad-soft:#fbe4e1; --warn:#7d5200; --warn-soft:#fdf0d2;
  --grid:#e1e7f3; --axis:#44526f; --ghost:#9aa6bf; --paper-dot:#cfd8ea;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --shadow:0 1px 2px rgba(20,32,58,.06),0 6px 18px rgba(20,32,58,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1322; --surface:#131c32; --surface-2:#18233d; --ink:#e7ecf8; --muted:#9facc9; --line:#27344f;
    --accent:#8ba0ff; --accent-ink:#0a1230; --accent-soft:#1d2b57; --accent-line:#34478a;
    --curve:#8ba0ff; --mark:#ff9a4d;
    --ok:#62d6a0; --ok-soft:#10382a; --bad:#ff9189; --bad-soft:#44201d; --warn:#f2c562; --warn-soft:#3b2f10;
    --grid:#1e2a45; --axis:#9aa8c8; --ghost:#5c6a8a; --paper-dot:#24304c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#131c32; --surface-2:#18233d; --ink:#e7ecf8; --muted:#9facc9; --line:#27344f;
  --accent:#8ba0ff; --accent-ink:#0a1230; --accent-soft:#1d2b57; --accent-line:#34478a;
  --curve:#8ba0ff; --mark:#ff9a4d;
  --ok:#62d6a0; --ok-soft:#10382a; --bad:#ff9189; --bad-soft:#44201d; --warn:#f2c562; --warn-soft:#3b2f10;
  --grid:#1e2a45; --axis:#9aa8c8; --ghost:#5c6a8a; --paper-dot:#24304c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55;
  padding-block:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0 0 .8em}
button,input,select{font:inherit;color:inherit}
.m,.math{font-family:var(--f-math);font-size:1.08em}
.m i,.math i,.qprompt i,.theory i{font-family:var(--f-math)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{max-width:1180px;margin:0 auto;padding-block:16px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;flex:none;color:var(--accent)}
.brand h1{font-size:1.7rem;font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.top-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.overall{display:flex;flex-direction:column;gap:4px;min-width:170px}
.overall span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.menu-btn{display:none}

.layout{display:grid;grid-template-columns:292px minmax(0,1fr);gap:28px;align-items:start}

/* ladder */
.ladder{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px;box-shadow:var(--shadow);max-height:calc(100vh - 28px);overflow:auto}
.ladder h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:2px 10px 8px;font-family:var(--f-body);font-weight:600}
.rungs{list-style:none;margin:0;padding:0;position:relative}
.rungs::before{content:"";position:absolute;left:25px;top:20px;bottom:20px;width:2px;background:var(--line)}
.rung{position:relative}
.rung button{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;padding:8px 10px;border-radius:10px;cursor:pointer;position:relative}
.rung button:hover{background:var(--surface-2)}
.rung button:focus-visible{outline:3px solid var(--accent);outline-offset:-2px}
.rung .n{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--f-display);font-weight:700;font-size:.9rem;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.rung .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.rung .t b{font-weight:600;font-size:.94rem;line-height:1.2}
.rung .t small{color:var(--muted);font-size:.78rem;display:flex;gap:8px;align-items:center}
.pips{display:inline-flex;gap:3px}
.pips u{width:14px;height:5px;border-radius:3px;background:var(--line);text-decoration:none;position:relative;overflow:hidden}
.pips u s{position:absolute;inset:0;background:var(--accent);width:0;text-decoration:none}
.rung.active button{background:var(--accent-soft)}
.rung.active .n{border-color:var(--accent);color:var(--accent)}
.rung.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rung.done .pips u s{background:var(--ok)}
.rung.special .n{border-radius:9px;font-size:.8rem}
.ladder hr{border:0;border-top:1px solid var(--line);margin:10px 8px}

/* main */
main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:18px}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.rung-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.rung-head h2{font-size:1.9rem;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.learn-list{margin:10px 0 0;padding-left:1.1em;color:var(--muted);font-size:.93rem}
.learn-list li{margin:2px 0}
.tabs{display:flex;gap:6px;margin:18px 0 16px;border-bottom:1px solid var(--line)}
.tab{all:unset;box-sizing:border-box;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:6px 6px 0 0}

/* buttons */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.2;text-align:center}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* theory */
.theory{max-width:760px}
.theory h3{font-size:1.25rem;margin:26px 0 8px;font-weight:700}
.theory h3:first-child{margin-top:4px}
.theory h4{font-size:1rem;margin:16px 0 6px;font-family:var(--f-body);font-weight:700}
.theory ul,.theory ol{padding-left:1.2em;margin:0 0 .9em}
.theory li{margin:3px 0}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.box.key{border-color:var(--accent-line);background:var(--accent-soft)}
.box.warn{border-color:#e8c872;background:var(--warn-soft);color:var(--ink)}
.box.ex{border-left:4px solid var(--accent)}
.box .lbl{display:block;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:4px}
.box.warn .lbl{color:var(--warn)}
.formula{font-family:var(--f-math);font-size:1.25rem;text-align:center;padding:8px 6px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:12px 0}
.cols > *{min-width:0}
.figure{margin:10px 0}
.figure figcaption{font-size:.84rem;color:var(--muted);text-align:center;margin-top:2px}
.tablewrap{overflow-x:auto;margin:10px 0}
table.t{border-collapse:collapse;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:6px 12px;text-align:center;font-family:var(--f-math);font-size:1.02rem;vertical-align:middle}
table.t th{background:var(--surface-2);font-weight:600}
table.t td.l,table.t th.l{text-align:left;font-family:var(--f-body);font-size:.93rem}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 .12em}
.frac>span:first-child{border-bottom:1.4px solid currentColor;padding:0 .18em}
.frac>span:last-child{padding:0 .18em}

/* graph */
svg.graph{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
svg.graph.small{max-width:220px}
.g-bg{fill:var(--surface)}
.g-grid{stroke:var(--grid);stroke-width:1}
.g-axis{stroke:var(--axis);stroke-width:1.5}
.g-tick{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.g-axl{fill:var(--axis);font-size:12px;font-family:var(--f-math);font-style:italic}
.g-curve{fill:none;stroke:var(--curve);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-ghost{fill:none;stroke:var(--ghost);stroke-width:1.8;stroke-dasharray:5 4;stroke-linecap:round}
.g-ghost2{fill:none;stroke:var(--ghost);stroke-width:1.6;opacity:.6;stroke-linecap:round}
.g-frame{fill:none;stroke:var(--line);stroke-width:1}
.g-pt{fill:var(--mark);stroke:var(--surface);stroke-width:1.5}
.g-pt2{fill:var(--surface);stroke:var(--curve);stroke-width:2}
.g-lbl{fill:var(--ink);font-size:11px;font-family:var(--f-math);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.g-v{stroke:var(--mark);stroke-width:1.4;stroke-dasharray:4 4}

/* explorer */
.explorer{border:1px solid var(--accent-line);background:var(--surface-2);border-radius:14px;padding:14px;margin:16px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.explorer h4{grid-column:1/-1;margin:0;font-family:var(--f-display);font-size:1.02rem;font-weight:700}
.explorer .ctl{display:flex;flex-direction:column;gap:10px;min-width:0}
.explorer .ctl label{display:grid;grid-template-columns:34px 1fr 52px;gap:8px;align-items:center;font-family:var(--f-math);font-size:1.1rem}
.explorer input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.explorer output{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--f-math);font-size:1.02rem}
.explorer .info{font-size:.92rem;display:flex;flex-direction:column;gap:3px}
.explorer .info .f{font-family:var(--f-math);font-size:1.25rem;padding:2px 0 6px}
.explorer .info div b{font-weight:600}
.explorer .tog{font-size:.88rem;display:flex;gap:8px;align-items:center}
.explorer .plot{min-width:0}
.explorer .full{grid-column:1/-1}

/* question card */
.qcard{max-width:760px}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:.82rem;color:var(--muted)}
.qmeta .tag{background:var(--surface-2);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.qprompt{font-size:1.05rem;line-height:1.7}
.qprompt p{margin:0 0 .6em}
.qprompt .fnline{font-family:var(--f-math);font-size:1.25rem;padding:4px 0}
.qrows{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.qrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-math);font-size:1.1rem}
.qrow .rl{font-family:var(--f-body);font-size:.97rem;min-width:0}
.qfig{margin:10px 0}
.in{width:5.4em;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--f-math);font-size:1.08rem;text-align:center;min-width:0}
.in:focus{border-color:var(--accent);outline:3px solid var(--accent-soft)}
.in.w2{width:7.4em}
select.sel{padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--f-math);font-size:1.02rem;max-width:100%}
.unit{font-family:var(--f-body);font-size:.92rem;color:var(--muted)}
.fw{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.fw.ok .in,.fw.ok select{border-color:var(--ok);background:var(--ok-soft)}
.fw.bad .in,.fw.bad select{border-color:var(--bad);background:var(--bad-soft)}
.fw .ans{font-family:var(--f-body);font-size:.84rem;color:var(--ok);font-weight:600}
.fw .near{font-family:var(--f-body);font-size:.82rem;color:var(--warn)}
.opts{display:grid;gap:8px;margin:10px 0}
.opts.g2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);min-width:0}
.opt:hover{border-color:var(--accent-line)}
.opt input{accent-color:var(--accent);flex:none;width:18px;height:18px}
.opt .ot{min-width:0;font-family:var(--f-math);font-size:1.08rem}
.opt.has-fig{align-items:flex-start;flex-direction:column;gap:4px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.reveal{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.qactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:.97rem}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ink)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad);color:var(--ink)}
.fb.hint{background:var(--warn-soft);border:1px solid #e8c872;color:var(--ink)}
.fb b.h{display:block;margin-bottom:2px}
.fb + .fb{margin-top:8px}
.sol{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:4px 16px 12px}
.sol summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--accent)}
.sol ol,.sol ul{margin:6px 0 0;padding-left:1.3em}
.sol li{margin:6px 0;font-family:var(--f-body)}
.sol .math,.sol .m{font-family:var(--f-math)}
.sol .fin{margin-top:8px;font-weight:600}
.mastery{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.mastery .bar{flex:1;min-width:140px;max-width:320px}
.mastery span{font-size:.84rem;color:var(--muted)}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ok-soft);border:1px solid var(--ok);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.banner b{font-family:var(--f-display);font-size:1.15rem}

/* home + plan */
.hero h2{font-size:2.2rem;font-weight:800;max-width:15em}
.hero p.lead{font-size:1.08rem;color:var(--muted);max-width:40em;margin-top:10px}
.plan{display:flex;border-radius:10px;overflow:hidden;height:34px;margin:16px 0 6px;border:1px solid var(--line)}
.plan div{display:grid;place-items:center;font-size:.76rem;font-weight:700;color:#fff;background:var(--accent);border-right:2px solid var(--surface);min-width:0;overflow:hidden;font-variant-numeric:tabular-nums}
.plan div:nth-child(even){filter:brightness(.84)}
.plan div.t{background:var(--mark);color:#1a0d00}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
.how > div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.how b{display:block;margin-bottom:2px;font-family:var(--f-display)}
.how span{font-size:.92rem;color:var(--muted)}

/* toets results */
.score{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1}
.breakdown{display:grid;gap:8px;margin:14px 0}
.bd{display:grid;grid-template-columns:minmax(0,180px) 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.bd .bar{height:10px}
.bd .bar i.low{background:var(--bad)}
.bd .bar i.mid{background:#c98a00}
.bd .bar i.hi{background:var(--ok)}
.review-item{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--surface)}
.review-item > summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:600;list-style:none}
.review-item > summary::-webkit-details-marker{display:none}
.review-item .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.85rem;flex:none}
.review-item .st.ok{background:var(--ok)}
.review-item .st.bad{background:var(--bad)}
.review-item .qcard{padding:0 16px 14px}

.cheat{columns:2 340px;column-gap:20px}
.cheat .box{break-inside:avoid;margin:0 0 14px}

.hide-sm{display:inline}
@media (max-width: 880px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .ladder{position:static;max-height:none;display:none}
  .ladder.open{display:block}
  .panel{padding:18px 16px}
  .hero h2{font-size:1.7rem}
  .rung-head h2{font-size:1.5rem}
  .explorer{grid-template-columns:minmax(0,1fr)}
  .bd{grid-template-columns:minmax(0,110px) 1fr auto}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }

/* terug naar het wiskundemenu, in de kleuren van deze app */
.terugknop{display:inline-grid;place-items:center;width:40px;height:40px;flex:none;
  border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);font-size:18px;text-decoration:none;
  transition:color .2s ease,border-color .2s ease}
.terugknop:hover{color:var(--accent);border-color:var(--accent-line)}
.bijwerkvoet{max-width:1180px;margin:0 auto;text-align:center;padding:0 16px 24px;
  font-family:var(--f-body);font-size:11px;letter-spacing:.07em;color:var(--muted);opacity:.85}
.bijwerkvoet b{font-weight:600;color:var(--ink)}

<script>
(function(){
'use strict';
/* ===================== CORE: rng, fracties, opmaak, grafieken, velden ===================== */
const PL = {};
window.PL = PL;

/* ---- rng (seedable zodat tests herhaalbaar zijn) ---- */
let _s = (Date.now() ^ 0x9e3779b9) >>> 0;

const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));
const pick = arr => arr[Math.floor(rand() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const chance = p => rand() < p;
const nz = (a, b) => { let v; do { v = ri(a, b); } while (v === 0); return v; };

/* ---- breuken ---- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };

const add = (x, y) => { x = fq(x); y = fq(y); return F(x.n * y.d + y.n * x.d, x.d * y.d); };
const sub = (x, y) => { x = fq(x); y = fq(y); return F(x.n * y.d - y.n * x.d, x.d * y.d); };
const mul = (x, y) => { x = fq(x); y = fq(y); return F(x.n * y.n, x.d * y.d); };
const div = (x, y) => { x = fq(x); y = fq(y); return F(x.n * y.d, x.d * y.n); };
const neg = x => { x = fq(x); return F(-x.n, x.d); };
const absF = x => { x = fq(x); return F(Math.abs(x.n), x.d); };
const val = x => { x = fq(x); return x.n / x.d; };
const eqF = (x, y) => { x = fq(x); y = fq(y); return x.n === y.n && x.d === y.d; };
const sgn = x => Math.sign(fq(x).n);
const isInt = x => fq(x).d === 1;
const sq = x => mul(x, x);

/* ---- vormen ---- */
const evalStd = (a, b, c, x) => add(add(mul(a, sq(x)), mul(b, x)), c);
const evalAB = (a, al, be, x) => add(mul(a, sq(sub(x, al))), be);
const abToStd = (a, al, be) => ({ a: fq(a), b: mul(neg(mul(2, a)), al), c: add(mul(a, sq(al)), be) });
const stdToAB = (a, b, c) => { const al = div(neg(b), mul(2, a)); return { a: fq(a), al, be: evalStd(a, b, c, al) }; };
const zerosOf = (a, al, be) => { // alleen als de nulwaarden rationaal zijn; anders null

const nZeros = (a, be) => { const s = sgn(a) * sgn(be); return s < 0 ? 2 : s === 0 ? 1 : 0; };

/* ---- opmaak (HTML) ---- */
const MIN = '−', LT = '&lt;', GT = '&gt;';
const X = '<i>x</i>';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function fmtF(x) { x = fq(x); const ng = x.n < 0, n = Math.abs(x.n); const body = x.d === 1 ? String(n) : `<span class="frac"><span>${n}</span><span>${x.d}</span></span>`; return (ng ? MIN : '') + body; }
function fmtT(x) { x = fq(x); const ng = x.n < 0, n = Math.abs(x.n); return (ng ? MIN : '') + (x.d === 1 ? String(n) : n + '/' + x.d); }
const par = x => { x = fq(x); return (x.n < 0 || x.d > 1) ? '(' + fmtF(x) + ')' : fmtF(x); };
function num(v, d = 2) { let s = String(Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).replace('.', ','); return s.replace('-', MIN); }

  }

}
const stdHTML = (a, b, c) => poly([{ c: a, v: X + '²' }, { c: b, v: X }, { c }]);
function abHTML(a, al, be) {
  a = fq(a); al = fq(al); be = fq(be);
  const inside = al.n === 0 ? X : `${X} ${al.n > 0 ? MIN : '+'} ${fmtF(absF(al))}`;
  const sqr = al.n === 0 ? X + '²' : `(${inside})²`;
  const co = eqF(a, 1) ? '' : eqF(a, -1) ? MIN : fmtF(a);

}
const FN = n => `<i>${n}</i>(${X}) = `;
const fnH = (n, body) => `<span class="fnline">${FN(n)}${body}</span>`;
const bereikTxt = (up, v) => up ? `[${fmtT(v)}, +∞[` : `]${MIN}∞, ${fmtT(v)}]`;
const bereikH = (up, v) => up ? `[${fmtF(v)}, +∞[` : `]${MIN}∞, ${fmtF(v)}]`;
const ptH = (x, y) => `(${fmtF(x)}, ${fmtF(y)})`;

/* ---- grafiek ---- */
let _gid = 0;
function viewFor(pts, o = {}) {
  const xs = pts.map(p => p[0]).concat([0]), ys = pts.map(p => p[1]).concat([0]);
  let x0 = Math.floor(Math.min(...xs)) - (o.mx != null ? o.mx : 1), x1 = Math.ceil(Math.max(...xs)) + (o.mx != null ? o.mx : 1);
  let y0 = Math.floor(Math.min(...ys)) - (o.my != null ? o.my : 1), y1 = Math.ceil(Math.max(...ys)) + (o.my != null ? o.my : 1);
  const minW = o.minW || 8, minH = o.minH || 6;
  while (x1 - x0 < minW) { x0--; if (x1 - x0 < minW) x1++; }
  while (y1 - y0 < minH) { y0--; if (y1 - y0 < minH) y1++; }
  return { x0, x1, y0, y1 };
}
function niceStep(range) { return range > 30 ? 5 : range > 14 ? 2 : 1; }
function graphSVG(o) {
  const W = o.w || 380, H = o.h || 280, ml = 28, mr = 12, mt = 12, mb = 22;
  const pw = W - ml - mr, ph = H - mt - mb;
  const { x0, x1, y0, y1 } = o;
  const sx = x => ml + (x - x0) / (x1 - x0) * pw, sy = y => mt + (y1 - y) / (y1 - y0) * ph;
  const id = 'gc' + (++_gid);

  let s = `<svg class="graph${o.small ? ' small' : ''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.alt || 'grafiek van een parabool')}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="${id}"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}"/></clipPath></defs>`;
  s += `<rect class="g-bg" x="${ml}" y="${mt}" width="${pw}" height="${ph}"/>`;
  for (let x = Math.ceil(x0 / xs) * xs; x <= x1; x += xs) s += `<line class="g-grid" x1="${sx(x).toFixed(1)}" y1="${mt}" x2="${sx(x).toFixed(1)}" y2="${mt + ph}"/>`;
  for (let y = Math.ceil(y0 / ys) * ys; y <= y1; y += ys) s += `<line class="g-grid" x1="${ml}" y1="${sy(y).toFixed(1)}" x2="${ml + pw}" y2="${sy(y).toFixed(1)}"/>`;
  s += `<rect class="g-frame" x="${ml}" y="${mt}" width="${pw}" height="${ph}"/>`;
  const ax = (0 >= x0 && 0 <= x1) ? sx(0) : ml, ay = (0 >= y0 && 0 <= y1) ? sy(0) : mt + ph;
  s += `<line class="g-axis" x1="${ml}" y1="${ay.toFixed(1)}" x2="${ml + pw}" y2="${ay.toFixed(1)}"/><line class="g-axis" x1="${ax.toFixed(1)}" y1="${mt}" x2="${ax.toFixed(1)}" y2="${mt + ph}"/>`;
  if (!o.noTicks) {
    for (let x = Math.ceil(x0 / xs) * xs; x <= x1; x += xs) { if (x === 0) continue; const ty = Math.min(ay + 12, mt + ph + 12); s += `<text class="g-tick" x="${sx(x).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle">${x < 0 ? MIN + Math.abs(x) : x}</text>`; }
    for (let y = Math.ceil(y0 / ys) * ys; y <= y1; y += ys) { if (y === 0) continue; const tx = Math.max(ax - 4, ml - 3); s += `<text class="g-tick" x="${tx.toFixed(1)}" y="${(sy(y) + 3.5).toFixed(1)}" text-anchor="end">${y < 0 ? MIN + Math.abs(y) : y}</text>`; }
    s += `<text class="g-tick" x="${(ax - 4).toFixed(1)}" y="${(ay + 12).toFixed(1)}" text-anchor="end">0</text>`;
  }
  s += `<text class="g-axl" x="${ml + pw - 4}" y="${(ay - 5).toFixed(1)}" text-anchor="end">x</text><text class="g-axl" x="${(ax + 6).toFixed(1)}" y="${mt + 11}">y</text>`;
  for (const v of (o.vlines || [])) s += `<line class="g-v" x1="${sx(v).toFixed(1)}" y1="${mt}" x2="${sx(v).toFixed(1)}" y2="${mt + ph}"/>`;
  const curves = o.curves || (o.f ? [{ f: o.f, cls: 'g-curve' }] : []);
  for (const c of curves) {
    let d = '', pen = false; const N = 420;
    for (let i = 0; i <= N; i++) {
      const x = x0 + (x1 - x0) * i / N; let y = c.f(x); if (!isFinite(y)) { pen = false; continue; }
      let py = sy(y); py = Math.max(mt - 500, Math.min(mt + ph + 500, py));
      d += (pen ? 'L' : 'M') + sx(x).toFixed(1) + ' ' + py.toFixed(1); pen = true;
    }
    s += `<path class="${c.cls || 'g-curve'}" d="${d}" clip-path="url(#${id})"/>`;
  }
  for (const p of (o.marks || [])) {
    const cx = sx(p.x), cy = sy(p.y);
    s += `<circle class="${p.cls || 'g-pt'}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${p.r || 4}"/>`;
    if (p.label) { const pos = p.pos || 'tr'; const dx = pos.includes('l') ? -7 : pos.includes('r') ? 7 : 0, dy = pos.includes('t') ? -8 : pos.includes('b') ? 15 : 4; const anc = pos.includes('l') ? 'end' : pos.includes('r') ? 'start' : 'middle'; s += `<text class="g-lbl" x="${(cx + dx).toFixed(1)}" y="${(cy + dy).toFixed(1)}" text-anchor="${anc}">${p.label}</text>`; }
  }
  return s + '</svg>';
}
/* parabool met mooie kijkvensters */
function paraGraph(a, al, be, o = {}) {
  a = fq(a); al = fq(al); be = fq(be);
  const A = val(a), L = val(al), B = val(be);
  const f = x => A * (x - L) * (x - L) + B;
  const pts = [[L, B], [0, f(0)]];
  const k = o.k || 2;
  pts.push([L - k, f(L - k)], [L + k, f(L + k)]);
  const z = zerosOf(a, al, be); if (z) z.forEach(v => pts.push([val(v), 0]));
  (o.extra || []).forEach(p => pts.push(p));
  const view = o.view || viewFor(pts, { minW: o.minW || 9, minH: o.minH || 7 });
  const marks = [];
  if (!o.noTop) marks.push({ x: L, y: B, cls: 'g-pt', label: o.topLabel || '', pos: o.topPos || 'tr' });
  (o.marks || []).forEach(m => marks.push(m));
  return { svg: graphSVG(Object.assign({ f, marks, vlines: o.axis ? [L] : [], alt: o.alt }, view, { small: o.small, w: o.w, h: o.h })), view, f };
}

/* ---- velden + opgave-opbouw ---- */
const numF = (id, ans, o = {}) => {
  if (typeof ans === 'number' && !Number.isInteger(ans)) { o = Object.assign({ dec: true, tol: 0.01 }, o); ans = F(Math.round(ans * 1000), 1000); }
  return Object.assign({ id, type: 'num', answer: fq(ans) }, o);
};
const selF = (id, options, ans, o = {}) => Object.assign({ id, type: 'sel', options, answer: ans }, o);
const choiceF = (id, options, ans, o = {}) => Object.assign({ id, type: 'choice', options, answer: ans }, o);
const multiF = (id, options, ans, o = {}) => Object.assign({ id, type: 'multi', options, answer: ans.slice().sort((a, b) => a - b) }, o);
/* correct + fouten -> geschud keuzeveld (dedupe op tekst) */
function mcField(id, correct, wrongs, o = {}) {
  const seen = new Set([correct]); const w = [];
  for (const x of wrongs) { if (!seen.has(x)) { seen.add(x); w.push(x); } }
  const opts = shuffle([correct].concat(w.slice(0, o.n != null ? o.n : 3)));
  return choiceF(id, opts, opts.indexOf(correct), o);
}
const SOORT = ['dalparabool', 'bergparabool'];
const SIGN3 = [LT + ' 0', GT + ' 0', '= 0'];
const CMP = [GT, LT, '='];
const ARROW = ['↗', '↘'];
const EXT = ['minimum', 'maximum'];
const NULN = ['geen nulwaarden', 'één nulwaarde', 'twee nulwaarden'];
const sign3idx = x => { const s = sgn(x); return s > 0 ? 1 : s < 0 ? 0 : 2; };
const cmpIdx = x => { const s = sgn(x); return s > 0 ? 0 : s < 0 ? 1 : 2; };

/* ---- invoer lezen + nakijken ---- */
function parseNum(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(',', '.');
  if (!s) return null;
  let m = s.match(/^([+-]?)(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (m) { const d = parseFloat(m[3]); if (d === 0) return null; const v = parseFloat(m[2]) / d; return m[1] === '-' ? -v : v; }
  m = s.match(/^[+-]?(\d+(?:\.\d*)?|\.\d+)$/);
  if (m) return parseFloat(s);
  return null;
}
function gradeField(f, v) {
  if (f.type === 'num') {
    const p = parseNum(v);
    if (p === null) return { ok: false, empty: v == null || String(v).trim() === '', msg: 'Dit is geen getal. Typ bv. 3, -2,5 of 1/2.' };
    const ans = val(f.answer), tol = f.tol != null ? f.tol : 1e-9;
    if (Math.abs(p - ans) <= tol) return { ok: true };
    if (f.tol == null && fq(f.answer).d > 1 && /[.,]/.test(String(v)) && Math.abs(p - ans) < 0.011) return { ok: false, near: true };
    return { ok: false };
  }
  if (f.type === 'sel' || f.type === 'choice') {
    if (v === '' || v == null) return { ok: false, empty: true };
    return { ok: Number(v) === f.answer };
  }
  if (f.type === 'multi') {
    const s = (v || []).map(Number).sort((a, b) => a - b);
    return { ok: s.length === f.answer.length && s.every((x, i) => x === f.answer[i]), empty: !s.length };
  }

}
function gradeQ(q, values) {
  const res = {}; let ok = true;
  for (const f of q.fields) { const r = gradeField(f, values[f.id]); res[f.id] = r; if (!r.ok) ok = false; }
  return { ok, res };
}
function answerText(f) {
  if (f.type === 'num') return (f.dec ? num(val(f.answer), 3) : fmtF(f.answer)) + (f.unit ? ' ' + f.unit : '');
  if (f.type === 'sel' || f.type === 'choice') return f.options[f.answer];
  return f.answer.map(i => f.options[i]).join(' · ');
}
/* wat een leerling zou typen (voor tests) */
PL.answerFor = function (f) {
  if (f.type === 'num') {
    const a = fq(f.answer);
    if (f.dec) return String(val(a)).replace('.', ',');
    if (a.d === 1) return pick([String(a.n), String(a.n).replace('-', '−')]);
    const dec = a.n / a.d;
    const exact = Math.abs(Math.round(dec * 1000) / 1000 - dec) < 1e-12;
    return exact && chance(.5) ? String(dec).replace('.', ',') : `${a.n}/${a.d}`;
  }
  if (f.type === 'multi') return f.answer.map(String);
  return String(f.answer);
};

/* ===================== OPGAVEN sport 1 t/m 5 ===================== */
const A_ALL = [1, 1, 2, 2, 3, -1, -1, -2, -2, -3, F(1, 2), F(-1, 2), F(1, 3), F(-1, 3), F(1, 4), F(-1, 4), F(3, 2), F(-3, 2)];

  do { a = fq(pick(pool)); } while ((o.pos && a.n < 0) || (o.neg && a.n > 0) || (o.noOne && Math.abs(a.n) === 1 && a.d === 1));
  return a;
}
const fname = () => pick(['f', 'g', 'h', 'k']);

/* ---------- gedeelde analyse-opbouw ---------- */
/* items: soort, top, as, bereik, nul, sy, verloop ; ctx.form: 'ab' | 'std' | 'x2' ; ctx.std = {a,b,c} */
function bereikSel(a, al, be) {
  const up = a.n > 0, correct = bereikTxt(up, be);
  const cands = [bereikTxt(!up, be), bereikTxt(up, al), bereikTxt(!up, al), `]${MIN}∞, +∞[`];
  const seen = new Set([correct]); const w = [];
  for (const c of cands) if (!seen.has(c)) { seen.add(c); w.push(c); }
  const opts = shuffle([correct].concat(w.slice(0, 3)));
  return selF('ber', opts, opts.indexOf(correct));
}
function analysis(items, a, al, be, ctx) {

  const fields = [], rows = [], steps = [];
  const has = k => items.includes(k);
  const nz_ = nZeros(a, be);

    fields.push(selF('soort', SOORT, up ? 0 : 1));
    rows.push(`<div class="qrow"><span class="rl">Soort parabool:</span>{{soort}}</div>`);
    steps.push(`Soort parabool: a = ${fmtF(a)} ${up ? GT + ' 0, dus een <b>dalparabool</b>' : LT + ' 0, dus een <b>bergparabool</b>'}.`);
  }
  const topStep = () => {
    if (form === 'x2') return `De top van <i>y</i> = <i>a</i>${X}² ligt in de oorsprong: T(0, 0).`;
    if (form === 'ab') return `Lees α en β af uit het voorschrift. Let op het teken: ${al.n === 0 ? 'er staat geen verschuiving, dus α = 0' : `(${X} ${al.n > 0 ? MIN : '+'} ${fmtF(absF(al))}) betekent α = ${fmtF(al)}`}. Dus T(${fmtF(al)}, ${fmtF(be)}).`;
    return `α = ${MIN}<i>b</i>/(2<i>a</i>) = ${MIN}${par(st.b)}/(2 · ${par(st.a)}) = <b>${fmtF(al)}</b><br>β = <i>f</i>(α) = <i>f</i>(${fmtF(al)}) = <b>${fmtF(be)}</b><br>Dus T(${fmtF(al)}, ${fmtF(be)}).`;
  };
  if (has('top')) {
    fields.push(numF('tx', al), numF('ty', be));
    rows.push(`<div class="qrow"><span class="rl">Top:</span> T( {{tx}} , {{ty}} )</div>`);
    steps.push(topStep());
  }
  if (has('as')) {
    fields.push(numF('as', al));
    rows.push(`<div class="qrow"><span class="rl">Vergelijking van de symmetrieas:</span> <i>x</i> = {{as}}</div>`);
    steps.push(`De symmetrieas is de verticale rechte door de top: <i>x</i> = α = <b>${fmtF(al)}</b>.`);
  }
  if (has('bereik')) {

/* ===================== SPORT 3: transformaties ===================== */
const eenh = d => Math.abs(d) === 1 ? 'eenheid' : 'eenheden';
const T = {
  refl: 'een spiegeling om de <i>x</i>-as',
  rely: 'een spiegeling om de <i>y</i>-as',
  stretch: k => `een verticale uitrekking met factor ${fmtF(absF(k))}`,
  h: d => `een horizontale verschuiving naar ${sgn(d) > 0 ? 'rechts' : 'links'} met ${fmtF(absF(d))} ${eenh(val(d))}`,
  v: d => `een verticale verschuiving naar ${sgn(d) > 0 ? 'boven' : 'onder'} met ${fmtF(absF(d))} ${eenh(val(d))}`,
};
function g3_fromFormula() {
  let a, al, be;
  do { a = randA(); al = chance(.8) ? nz(-6, 6) : 0; be = chance(.8) ? nz(-6, 6) : 0; } while (eqF(a, 1) && al === 0 && be === 0);
  al = fq(al); be = fq(be);
  const name = fname();
  const correct = [], wrong = [];
  if (a.n < 0) { correct.push(T.refl); wrong.push(T.rely); } else wrong.push(T.refl);
  if (!eqF(absF(a), 1)) { correct.push(T.stretch(absF(a))); wrong.push(T.stretch(div(1, absF(a)))); }
  if (al.n !== 0) { correct.push(T.h(al)); wrong.push(T.h(neg(al))); }
  if (be.n !== 0) { correct.push(T.v(be)); wrong.push(T.v(neg(be))); }
  const wr = shuffle(wrong).filter(w => !correct.includes(w)).slice(0, Math.max(2, 6 - correct.length));
  const opts = shuffle(correct.concat(wr));
  const ans = correct.map(c => opts.indexOf(c));
  return {
    kind: 'trf-uit-voorschrift', tag: 'Transformaties lezen',
    prompt: `<p>Welke transformaties zetten de grafiek van <i>y</i> = <i>x</i>² om in de grafiek van</p>${FNL(name, abHTML(a, al, be))}<p>Vink <b>alle</b> juiste uitspraken aan.</p>{{pick}}`,
    fields: [multiF('pick', opts, ans)],
    hints: ['Lees het voorschrift van links naar rechts: eerst <i>a</i>, dan (<i>x</i> ' + MIN + ' α)², dan + β.', 'Let op het teken van α: (<i>x</i> ' + MIN + ' 3)² verschuift naar <b>rechts</b>, (<i>x</i> + 3)² naar <b>links</b>. Het teken van β klopt wel met de richting.'],
    sol: solList([
      `<i>a</i> = ${fmtF(a)}: ${a.n < 0 ? 'negatief, dus ' + T.refl + (eqF(absF(a), 1) ? '' : ' en ' + T.stretch(absF(a))) : eqF(a, 1) ? 'geen uitrekking of spiegeling' : T.stretch(a)}.`,
      al.n === 0 ? 'Er staat geen (<i>x</i> ' + MIN + ' α): geen horizontale verschuiving.' : `(${X} ${al.n > 0 ? MIN : '+'} ${fmtF(absF(al))}) betekent α = ${fmtF(al)}: ${T.h(al)}.`,
      be.n === 0 ? 'Er staat geen + β: geen verticale verschuiving.' : `β = ${fmtF(be)}: ${T.v(be)}.`
    ])

function solve2(c, x1, y1, x2, y2) { // a x^2 + b x + c door (x1,y1),(x2,y2)
  const Y1 = sub(y1, c), Y2 = sub(y2, c);
  const D = mul(mul(x1, x2), sub(x1, x2));
  const a = div(sub(mul(Y1, x2), mul(Y2, x1)), D);
  const b = div(sub(mul(sq(x1), Y2), mul(sq(x2), Y1)), D);
  return { a, b };
}

function g10_boog() {

function g10_rivier() {

  const get = k => parseFloat(el.querySelector('#' + uid + k).value);

    const v = {}; Object.keys(sl).forEach(k => { v[k] = get(k); el.querySelector('#' + uid + k + 'o').textContent = decT(v[k]); });

      const A = fq(F(Math.round(v.a * 4), 4)), up = v.a > 0;

      return;
    }
    if (mode === 'ab') {
      if (v.a === 0) { plot.innerHTML = graphSVG(Object.assign({ f: () => v.be }, view)); info.innerHTML = `<div><b>a = 0 mag niet.</b></div>`; return; }
      const A = fq(F(Math.round(v.a * 4), 4)), al = fq(v.al), be = fq(v.be), up = v.a > 0;

  };

const rp = (v) => v < 0 ? MIN + Math.abs(v) : String(v);

function theory1() {
  const dal = graphSVG({ f: x => .5 * (x - 1) * (x - 1) - 2, x0: -4, x1: 6, y0: -4, y1: 6, marks: [{ x: 1, y: -2, cls: 'g-pt', label: 'top', pos: 'tr' }], vlines: [1], alt: 'dalparabool', w: 340, h: 250, small: false });
  const berg = graphSVG({ f: x => -.5 * (x + 1) * (x + 1) + 3, x0: -6, x1: 4, y0: -4, y1: 6, marks: [{ x: -1, y: 3, cls: 'g-pt', label: 'top', pos: 'tr' }], vlines: [-1], alt: 'bergparabool', w: 340, h: 250 });
  return `<h3>Wat is een tweedegraadsfunctie?</h3>
<p>Een <b>tweedegraadsfunctie</b> heeft een voorschrift van de vorm</p>
<div class="formula"><i>f</i>(${X}) = <i>a</i>${X}² + <i>b</i>${X} + <i>c</i> &nbsp; met <i>a</i> ∈ ℝ₀ en <i>b</i>, <i>c</i> ∈ ℝ</div>
<p>De hoogste macht van ${X} is 2. Het getal <i>a</i> mag niet 0 zijn. Anders verdwijnt de term met ${X}² en blijft er een eerstegraadsfunctie (een rechte) over. <i>b</i> en <i>c</i> mogen wel 0 zijn.</p>

<tr><td class="l"><i>g</i>(<i>t</i>) = ${MIN}<span class="frac"><span>1</span><span>2</span></span><i>t</i>² ${MIN} <i>t</i></td><td>${MIN}<span class="frac"><span>1</span><span>2</span></span></td><td>${MIN}1</td><td>0</td></tr>
<tr><td class="l"><i>h</i>(${X}) = 5 ${MIN} ${X}²</td><td>${MIN}1</td><td>0</td><td>5</td></tr></table></div>
<div class="box warn"><span class="lbl">Let op</span>Een term die ontbreekt heeft coëfficiënt 0. Bij 5 ${MIN} ${X}² is <i>a</i> = ${MIN}1 en <i>b</i> = 0. De volgorde van de termen maakt niet uit.</div>
<h3>De grafiek is een parabool</h3>

function theory2() {

<div class="box"><span class="lbl">a ${LT} 0 (berg)</span>bereik: ]${MIN}∞, 0]<br>${verloopTbl(false, '0', '0')}</div></div>

function theory3() {

<tr><td class="l">|<i>a</i>| ≠ 1</td><td class="l">verticale uitrekking met factor |<i>a</i>| (ook bij een factor kleiner dan 1)</td></tr>
<tr><td class="l">(${X} ${MIN} α)²</td><td class="l">horizontale verschuiving: α ${GT} 0 naar <b>rechts</b>, α ${LT} 0 naar <b>links</b></td></tr>
<tr><td class="l">+ β</td><td class="l">verticale verschuiving: β ${GT} 0 naar boven, β ${LT} 0 naar onder</td></tr></table></div>
<div class="box warn"><span class="lbl">Let op het teken van α</span>(${X} ${MIN} 3)² verschuift 3 naar <b>rechts</b>. (${X} + 3)² verschuift 3 naar <b>links</b>, want (${X} + 3) = (${X} ${MIN} (${MIN}3)), dus α = ${MIN}3. Bij β klopt het teken wel met de richting.</div>
<div class="box key"><span class="lbl">Volgorde</span>Spiegelen en uitrekken doe je <b>eerst</b>, verschuiven daarna. Verschuif je eerst en rek je dan uit, dan wordt ook de verschuiving mee uitgerekt en krijg je een ander voorschrift. Daarom staat de volgorde in de opgave.</div>
<div class="box ex"><span class="lbl">Voorbeeld: van voorschrift naar transformaties</span><i>f</i>(${X}) = ${MIN}<span class="frac"><span>1</span><span>2</span></span>(${X} + 2)² + 4<br>1. verticale uitrekking met factor <span class="frac"><span>1</span><span>2</span></span><br>2. spiegeling om de <i>x</i>-as<br>3. horizontale verschuiving naar links met 2 eenheden (α = ${MIN}2)<br>4. verticale verschuiving naar boven met 4 eenheden</div>
<div class="box ex"><span class="lbl">Voorbeeld: van transformaties naar voorschrift</span>Spiegel om de <i>x</i>-as, rek verticaal uit met factor 3, verschuif volgens de vector <i>v</i>⃗(${MIN}1, 4).<br>${X}² → ${MIN}${X}² → ${MIN}3${X}² → <b>${MIN}3(${X} + 1)² + 4</b></div>
<div class="box ex"><span class="lbl">Voorbeeld: merkwaardig product</span><i>y</i> = ${X}² + 6${X} + 9 = (${X} + 3)². De grafiek van ${X}² schuift dus 3 eenheden naar links.</div>`;
}

function theory4() {
  return `<h3>Alles aflezen uit <i>f</i>(${X}) = <i>a</i>(${X} ${MIN} α)² + β</h3>
<p>De α-β-vorm is de handigste vorm, want de top staat er letterlijk in. Probeer wat er verandert.</p>
<div data-explorer="ab" data-ghost="0" data-info="eig"></div>
<div class="box key"><span class="lbl">Wat lees je af?</span>
<ul style="margin:0"><li><b>top</b> T(α, β) en <b>symmetrieas</b> <i>x</i> = α</li><li><b>soort</b>: <i>a</i> ${GT} 0 dalparabool (top = minimum), <i>a</i> ${LT} 0 bergparabool (top = maximum)</li><li><b>bereik</b>: dal [<i>β</i>, +∞[, berg ]${MIN}∞, <i>β</i>]. Het bereik gaat over de <i>y</i>-waarde β.</li><li><b>snijpunt met de <i>y</i>-as</b>: vul ${X} = 0 in: <i>f</i>(0) = <i>a</i>α² + β.</li></ul></div>
<h4>Hoeveel nulwaarden?</h4>
<div class="tablewrap"><table class="t"><tr><th class="l">top t.o.v. de <i>x</i>-as</th><th class="l">dalparabool (<i>a</i> ${GT} 0)</th><th class="l">bergparabool (<i>a</i> ${LT} 0)</th></tr>
<tr><td class="l">β ${GT} 0 (boven)</td><td class="l">geen nulwaarden</td><td class="l">twee nulwaarden</td></tr>
<tr><td class="l">β = 0 (op)</td><td class="l">één nulwaarde: α</td><td class="l">één nulwaarde: α</td></tr>
<tr><td class="l">β ${LT} 0 (onder)</td><td class="l">twee nulwaarden</td><td class="l">geen nulwaarden</td></tr></table></div>
<div class="box ex"><span class="lbl">Nulwaarden berekenen</span><i>f</i>(${X}) = 2(${X} ${MIN} 1)² ${MIN} 8<br>2(${X} ${MIN} 1)² ${MIN} 8 = 0 → (${X} ${MIN} 1)² = 4 → ${X} ${MIN} 1 = 2 of ${X} ${MIN} 1 = ${MIN}2<br><b>${X} = 3 of ${X} = ${MIN}1</b>. Ze liggen symmetrisch rond ${X} = 1.</div>
<h4>Tekenverloop en verloopschema</h4>
<p>Het <b>tekenverloop</b> toont waar <i>f</i>(${X}) positief (+), negatief (${MIN}) of 0 is. Het <b>verloopschema</b> toont waar de functie stijgt (↗) of daalt (↘) en wat de top is. Voor de functie hierboven (<i>a</i> = 2, top T(1, ${MIN}8), nulwaarden ${MIN}1 en 3):</p>
<div class="tablewrap"><table class="t"><tr><th class="l"><i>x</i></th><td>${MIN}∞</td><td>${MIN}1</td><td>3</td><td>+∞</td></tr><tr><th class="l"><i>f</i>(${X})</th><td>+</td><td>0</td><td>${MIN}</td><td>0</td><td>+</td></tr></table></div>
<div class="tablewrap">${verloopTbl(true, '1', MIN + '8')}</div>`;
}

function theory5() {
  const f = x => (x - 1) * (x - 1) - 4;
  const g = graphSVG({ f, x0: -3, x1: 5, y0: -5, y1: 4, marks: [{ x: 1, y: -4, cls: 'g-pt', label: 'T(1, ' + MIN + '4)', pos: 'br' }, { x: -1, y: 0, cls: 'g-pt2' }, { x: 3, y: 0, cls: 'g-pt2' }, { x: 0, y: -3, cls: 'g-pt2', label: '(0, ' + MIN + '3)', pos: 'bl' }], vlines: [1], alt: 'voorbeeldgrafiek', w: 380, h: 280 });
  return `<h3>Een grafiek lezen en tekenen</h3>
<div class="cols"><figure class="figure">${g}<figcaption>De grafiek van <i>f</i>(${X}) = (${X} ${MIN} 1)² ${MIN} 4. De stippellijn is de symmetrieas.</figcaption></figure>
<div><h4>Zo lees je ze af</h4><ol><li><b>top</b>: T(1, ${MIN}4), dus α = 1 en β = ${MIN}4.</li><li><b>soort</b>: open naar boven, dus <i>a</i> ${GT} 0.</li><li><b>nulwaarden</b>: snijpunten met de ${X}-as: ${MIN}1 en 3.</li><li><b>snijpunt <i>y</i>-as</b>: (0, ${MIN}3).</li><li><b>symmetrieas</b>: ${X} = 1.</li><li><b>bereik</b>: [${MIN}4, +∞[.</li></ol></div></div>
<div class="tablewrap"><table class="t"><tr><th class="l">tekenverloop</th><td>${MIN}∞</td><td>${MIN}1</td><td>3</td><td>+∞</td></tr><tr><th class="l"><i>f</i>(${X})</th><td>+</td><td>0</td><td>${MIN}</td><td>0</td><td>+</td></tr></table></div>
<div class="tablewrap"><table class="t"><tr><th class="l">verloopschema</th><td>${MIN}∞</td><td>1</td><td>+∞</td></tr><tr><th class="l"><i>f</i>(${X})</th><td>↘</td><td>${MIN}4</td><td>↗</td></tr><tr><th class="l"></th><td></td><td>min</td><td></td></tr></table></div>
<div class="box key"><span class="lbl">Regels</span><ul style="margin:0"><li><b>Tekenverloop</b>: waar de grafiek <b>boven</b> de ${X}-as ligt is <i>f</i> positief, <b>onder</b> de ${X}-as negatief. In een nulwaarde is ze 0.</li><li><b>Verloopschema</b>: loop van links naar rechts. Gaat de grafiek omhoog (↗) of omlaag (↘)? In de top verandert dat.</li><li>Het <b>bereik</b> lees je af op de <i>y</i>-as, de <b>nulwaarden</b> en de <b>symmetrieas</b> op de ${X}-as.</li></ul></div>
<h3>De grafiek tekenen</h3>
<ol><li>Bereken de top (en de symmetrieas).</li><li>Maak een tabel met een paar ${X}-waarden links en rechts van de top, bv. α ${MIN} 2, α ${MIN} 1, α, α + 1, α + 2.</li><li>Teken de punten en verbind ze met een vloeiende kromme. Door de symmetrie krijg je de ene helft gratis van de andere.</li></ol>
<div class="box ex"><span class="lbl">Voorbeeld</span><i>f</i>(${X}) = ${MIN}0,25(${X} ${MIN} 4)² + 2: top T(4, 2).<div class="tablewrap"><table class="t"><tr><th class="l">${X}</th><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr><tr><th class="l"><i>f</i>(${X})</th><td>1</td><td>1,75</td><td>2</td><td>1,75</td><td>1</td></tr></table></div></div>`;
}

function theory6() {
  return `<h3>Van α-β-vorm naar standaardvorm, en terug</h3>
<p>Dezelfde parabool kan op twee manieren geschreven worden. Beide vormen zijn gelijkwaardig.</p>
<div class="cols"><div class="box"><span class="lbl">α-β-vorm</span><span class="math"><i>f</i>(${X}) = <i>a</i>(${X} ${MIN} α)² + β</span><br>handig voor de top</div><div class="box"><span class="lbl">standaardvorm</span><span class="math"><i>f</i>(${X}) = <i>a</i>${X}² + <i>b</i>${X} + <i>c</i></span><br>handig voor het snijpunt met de <i>y</i>-as</div></div>
<h4>Uitwerken: α-β → standaard</h4>
<p>Werk het kwadraat uit en vermenigvuldig met <i>a</i>. Voorbeeld: 2(${X} ${MIN} 1)² + 3 = 2(${X}² ${MIN} 2${X} + 1) + 3 = <b>2${X}² ${MIN} 4${X} + 5</b>.</p>
<div class="box key"><span class="lbl">Formules</span><span class="math">α = ${MIN}<span class="frac"><span><i>b</i></span><span>2<i>a</i></span></span></span> &nbsp; en &nbsp; <span class="math">β = <i>f</i>(α)</span><br>Omgekeerd: <i>b</i> = ${MIN}2<i>a</i>α en <i>c</i> = <i>a</i>α² + β.</div>
<h4>De top berekenen uit de standaardvorm</h4>
<div class="box ex"><span class="lbl">Voorbeeld</span><i>f</i>(${X}) = 2${X}² ${MIN} 8${X} + 9. Hier is <i>a</i> = 2, <i>b</i> = ${MIN}8, <i>c</i> = 9.<br>α = ${MIN}(${MIN}8)/(2 · 2) = 8/4 = <b>2</b><br>β = <i>f</i>(2) = 2 · 4 ${MIN} 16 + 9 = <b>1</b><br>De top is <b>T(2, 1)</b>. Dus <i>f</i>(${X}) = 2(${X} ${MIN} 2)² + 1.</div>
<p>Probeer het met de schuifjes. Kijk hoe α en β meebewegen met <i>a</i>, <i>b</i> en <i>c</i>.</p>
<div data-explorer="abc"></div>
<div class="box key"><span class="lbl">Minimum of maximum</span>De top is het enige punt waar een extreme waarde bereikt wordt. Voor welke ${X} is de waarde het kleinst (dalparabool) of het grootst (bergparabool)? Voor ${X} = α. Hoe groot is die waarde? β.</div>`;
}

function theory7() {
  const f = x => x * x - 4 * x + 3;
  const g = graphSVG({ f, x0: -2, x1: 6, y0: -3, y1: 6, marks: [{ x: 2, y: -1, cls: 'g-pt', label: 'T(2, ' + MIN + '1)', pos: 'br' }, { x: 0, y: 3, cls: 'g-pt2', label: '(0, 3)', pos: 'tr' }], vlines: [2], alt: 'voorbeeld abc', w: 380, h: 280 });
  return `<h3>Eigenschappen uit de standaardvorm</h3>
<p>Je hoeft niet te herschrijven om alles te weten. Je rekent de top uit en leest de rest eruit.</p>
<ol><li><b>soort</b>: teken van <i>a</i>.</li><li><b>top</b>: α = ${MIN}<i>b</i>/(2<i>a</i>), β = <i>f</i>(α).</li><li><b>symmetrieas</b>: ${X} = α.</li><li><b>snijpunt met de <i>y</i>-as</b>: (0, <i>c</i>).</li><li><b>bereik, aantal nulwaarden, verloopschema</b>: uit de top en het soort.</li></ol>
<div class="box ex"><span class="lbl">Voorbeeld</span><i>g</i>(${X}) = ${MIN}<span class="frac"><span>1</span><span>3</span></span>${X}² ${MIN} 2${X} + 3.<br><i>a</i> = ${MIN}<span class="frac"><span>1</span><span>3</span></span> ${LT} 0: bergparabool.<br>α = ${MIN}(${MIN}2)/(2 · (${MIN}<span class="frac"><span>1</span><span>3</span></span>)) = 2/(${MIN}<span class="frac"><span>2</span><span>3</span></span>) = ${MIN}3, β = <i>g</i>(${MIN}3) = ${MIN}3 + 6 + 3 = 6.<br>Top T(${MIN}3, 6), bergparabool met top boven de ${X}-as: twee nulwaarden. Bereik ]${MIN}∞, 6]. Snijpunt <i>y</i>-as (0, 3).</div>
<h3>Tekens van <i>a</i>, <i>b</i> en <i>c</i> uit een grafiek</h3>
<div class="cols"><figure class="figure">${g}<figcaption><i>f</i>(${X}) = ${X}² ${MIN} 4${X} + 3. De top en het snijpunt met de <i>y</i>-as zijn aangeduid.</figcaption></figure>
<div><ul><li><b><i>a</i></b>: open naar boven? <i>a</i> ${GT} 0. Naar onder? <i>a</i> ${LT} 0.</li><li><b><i>c</i></b>: het snijpunt met de <i>y</i>-as is (0, <i>c</i>). Boven de ${X}-as: <i>c</i> ${GT} 0, onder: <i>c</i> ${LT} 0, in de oorsprong: <i>c</i> = 0.</li><li><b><i>b</i></b>: gebruik α = ${MIN}<i>b</i>/(2<i>a</i>), dus <i>b</i> = ${MIN}2<i>a</i>α.</li></ul></div></div>
<div class="box key"><span class="lbl">Regel voor b</span><ul style="margin:0"><li>Top <b>links</b> van de <i>y</i>-as (α ${LT} 0): <i>b</i> heeft hetzelfde teken als <i>a</i>.</li><li>Top <b>rechts</b> van de <i>y</i>-as (α ${GT} 0): <i>b</i> heeft het tegengestelde teken van <i>a</i>.</li><li>Top <b>op</b> de <i>y</i>-as (α = 0): <i>b</i> = 0.</li></ul>In het voorbeeld: <i>a</i> ${GT} 0, top rechts van de <i>y</i>-as, dus <i>b</i> ${LT} 0 (en inderdaad <i>b</i> = ${MIN}4). <i>c</i> = 3 ${GT} 0.</div>
<div class="box warn"><span class="lbl">Let op</span>${MIN}<i>b</i>/(2<i>a</i>) is een ${X}-waarde (α), en <i>f</i>(${MIN}<i>b</i>/(2<i>a</i>)) is een <i>y</i>-waarde (β). Verwar ze niet bij vergelijkingen met 0.</div>`;
}

function theory8() {
  return `<h3>Een voorschrift opstellen</h3>
<p>Welke methode je kiest hangt af van wat gegeven is. Kijk altijd eerst: <b>is de top gegeven?</b></p>
<div class="box key"><span class="lbl">Methode 1: de top is gegeven</span>Gebruik de α-β-vorm <i>f</i>(${X}) = <i>a</i>(${X} ${MIN} α)² + β.<ol style="margin:6px 0 0"><li>Vul α en β van de top in.</li><li>Vul de coördinaat van het andere punt in.</li><li>Los de vergelijking op naar <i>a</i>.</li><li>Schrijf het voorschrift op (en werk uit als het in standaardvorm moet).</li></ol></div>
<div class="box ex"><span class="lbl">Voorbeeld</span>Top T(5, 2), punt A(1, 3).<br><i>f</i>(${X}) = <i>a</i>(${X} ${MIN} 5)² + 2<br>3 = <i>a</i>(1 ${MIN} 5)² + 2 → 1 = 16<i>a</i> → <i>a</i> = <span class="frac"><span>1</span><span>16</span></span><br><i>f</i>(${X}) = <span class="frac"><span>1</span><span>16</span></span>(${X} ${MIN} 5)² + 2</div>
<div class="box key"><span class="lbl">Methode 2: snijpunt met de y-as + twee andere punten</span>Gebruik de standaardvorm. Het punt (0, <i>c</i>) geeft <i>c</i>. De twee andere punten geven een stelsel in <i>a</i> en <i>b</i>.</div>
<div class="box ex"><span class="lbl">Voorbeeld</span>A(2, ${MIN}5), B(4, ${MIN}9), C(0, 3).<br>C geeft <i>c</i> = 3.<br>A: ${MIN}5 = 4<i>a</i> + 2<i>b</i> + 3 → ${MIN}4 = 2<i>a</i> + <i>b</i><br>B: ${MIN}9 = 16<i>a</i> + 4<i>b</i> + 3 → ${MIN}3 = 4<i>a</i> + <i>b</i><br>Aftrekken: 1 = 2<i>a</i>, dus <i>a</i> = <span class="frac"><span>1</span><span>2</span></span>, en dan <i>b</i> = ${MIN}5.<br><i>f</i>(${X}) = <span class="frac"><span>1</span><span>2</span></span>${X}² ${MIN} 5${X} + 3</div>
<div class="box key"><span class="lbl">Methode 3: symmetrie gebruiken</span>Twee punten met dezelfde <i>y</i>-waarde liggen symmetrisch. De symmetrieas ligt in het midden van hun ${X}-waarden. Uit α = ${MIN}<i>b</i>/(2<i>a</i>) volgt <i>b</i> = ${MIN}2<i>a</i>α. Zo houd je nog maar één onbekende (<i>a</i>) over.</div>
<div class="box ex"><span class="lbl">Voorbeeld</span>A(3, ${MIN}1), B(0, 2), C(2, 2). B en C hebben dezelfde <i>y</i>-waarde, dus de symmetrieas is ${X} = 1. Dan is <i>b</i> = ${MIN}2<i>a</i> en <i>c</i> = 2. Vul A in: ${MIN}1 = 9<i>a</i> ${MIN} 6<i>a</i> + 2 → <i>a</i> = ${MIN}1. Dus <i>f</i>(${X}) = ${MIN}${X}² + 2${X} + 2.</div>
<div class="box key"><span class="lbl">Uit een tabel of grafiek</span>Zoek de top, het snijpunt met de <i>y</i>-as (${X} = 0) of twee gelijke functiewaarden. Dan ben je terug bij methode 1, 2 of 3.</div>
<div class="box warn"><span class="lbl">Controle</span>Vul altijd een gegeven punt in jouw voorschrift in. Komt het uit, dan is het voorschrift juist.</div>`;
}

function theory9() {
  return `<h3>Gemiddelde verandering (differentiequotiënt)</h3>
<p>Het <b>differentiequotiënt</b> van <i>f</i> over het interval [<i>p</i>, <i>q</i>] meet hoeveel <i>f</i> gemiddeld verandert per eenheid van ${X}.</p>
<div class="formula">${dqH('f')} = <span class="frac"><span><i>f</i>(<i>q</i>) ${MIN} <i>f</i>(<i>p</i>)</span><span><i>q</i> ${MIN} <i>p</i></span></span></div>
<p>Op de grafiek is dat de <b>richtingscoëfficiënt van de rechte</b> door de punten (<i>p</i>, <i>f</i>(<i>p</i>)) en (<i>q</i>, <i>f</i>(<i>q</i>)). Bij een beweging is het de <b>gemiddelde snelheid</b>.</p>
<div class="box ex"><span class="lbl">Voorbeeld</span><i>f</i>(${X}) = 2${X}² over [${MIN}1, 2]: <i>f</i>(${MIN}1) = 2 en <i>f</i>(2) = 8.<br>${dqH('f')} = (8 ${MIN} 2)/(2 ${MIN} (${MIN}1)) = 6/3 = <b>2</b></div>
<div class="box key"><span class="lbl">Snelle controle</span>Voor <i>f</i>(${X}) = <i>a</i>${X}² + <i>b</i>${X} + <i>c</i> geldt ${dqH('f')} = <i>a</i>(<i>p</i> + <i>q</i>) + <i>b</i>. In het voorbeeld: 2 · (${MIN}1 + 2) + 0 = 2. Gebruik dit om je rekenwerk te controleren. In het examen moet je meestal de berekening met <i>f</i>(<i>q</i>) en <i>f</i>(<i>p</i>) tonen.</div>
<div class="box warn"><span class="lbl">Let op</span>Het differentiequotiënt over [<i>p</i>, <i>q</i>] met <i>p</i> en <i>q</i> symmetrisch rond de top is 0. Beide uiteinden liggen dan even hoog.</div>
<h3>Toenemend of afnemend, stijgend of dalend</h3>
<p>In een verloopschema zie je stijgend (↗) of dalend (↘). Je kunt ook zeggen <b>hoe</b> de functie stijgt of daalt.</p>
<div class="tablewrap"><table class="t"><tr><th class="l"></th><th class="l">links van de top ]${MIN}∞, α]</th><th class="l">rechts van de top [α, +∞[</th></tr><tr><td class="l">dalparabool</td><td class="l"><b>afnemend dalend</b></td><td class="l"><b>toenemend stijgend</b></td></tr><tr><td class="l">bergparabool</td><td class="l"><b>afnemend stijgend</b></td><td class="l"><b>toenemend dalend</b></td></tr></table></div>
<ul><li><b>toenemend</b>: de stijging of daling wordt steeds <b>sterker</b> (de grafiek wordt steiler), dus je gaat weg van de top.</li><li><b>afnemend</b>: de stijging of daling wordt steeds <b>zwakker</b> (de grafiek vlakt af), dus je gaat naar de top toe.</li></ul>`;
}

function theory10() {
  return `<h3>Vraagstukken met een tweedegraadsfunctie</h3>
<p>De meeste vraagstukken vragen een maximum of minimum. Dat is steeds de <b>top</b>.</p>
<div class="box key"><span class="lbl">Stappenplan</span><ol style="margin:0"><li>Kies een onbekende ${X} en schrijf wat er gevraagd wordt in functie van ${X}.</li><li>Stel het functievoorschrift op en schrijf het in de vorm <i>a</i>${X}² + <i>b</i>${X} + <i>c</i>.</li><li>Bereken de top: α = ${MIN}<i>b</i>/(2<i>a</i>) en β = <i>f</i>(α). Bergparabool: maximum. Dalparabool: minimum.</li><li>Beantwoord de vraag <b>in woorden, met eenheid</b>. Bij een maximum: let op of ze vragen naar α (de waarde van ${X}) of naar β (het maximum zelf).</li></ol></div>
<div class="box ex"><span class="lbl">Voorbeeld: rechthoek</span>Met 40 m draad omheint men een rechthoekige weide. Voor welke breedte is de oppervlakte maximaal?<br>Breedte ${X}, dan is de lengte 20 ${MIN} ${X} (halve omtrek 20 m).<br><i>A</i>(${X}) = ${X}(20 ${MIN} ${X}) = ${MIN}${X}² + 20${X}, een bergparabool.<br>α = ${MIN}20/(2 · (${MIN}1)) = 10 en <i>A</i>(10) = 100.<br><b>Antwoord</b>: een vierkant van 10 m bij 10 m met oppervlakte 100 m².</div>

/* ---- opslag (alleen een gemak per browser) ---- */
const KEY = 'parabolenladder-v1';
const store = { pts: {}, done: {}, best: null, last: null };
function loadStore() { try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); Object.assign(store, { pts: o.pts || {}, done: o.done || {}, best: o.best || null, last: o.last || null }); } } catch (e) { /* geen opslag */ } }
function saveStore() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* geen opslag */ } }

/* ---- vraag maken ---- */
function makeQ(ri, avoid) {
  const gens = RUNGS[ri].gens;
  for (let t = 0; t < 14; t++) {
    const total = gens.reduce((s, g) => s + g[1], 0); let r = rand() * total, fn = gens[0][0];
    for (const g of gens) { r -= g[1]; if (r <= 0) { fn = g[0]; break; } }
    try {
      const q = fn();
      if (avoid && q.kind === avoid && t < 9) continue;
      const blob = q.prompt + q.sol + q.fields.map(f => (f.options || []).join('|')).join('|');
      if (/NaN|undefined|Infinity|\[object|null/.test(blob)) { console.warn('ongeldige vraag', q.kind); continue; }
      q.rung = ri; return q;
    } catch (e) { console.error('fout in generator', e); }
  }
  throw new Error('geen vraag kunnen maken');
}

/* ---- veldweergave ---- */
let _qid = 0;
function fieldHTML(f, uid) {
  if (f.type === 'num') {
    const w = (f.dec || fq(f.answer).d > 1 || String(fmtT(f.answer)).length > 4) ? ' w2' : '';
    return `<span class="fw" data-w="${f.id}"><input class="in${w}" data-fid="${f.id}" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="antwoord ${f.id}">${f.unit ? `<span class="unit">${f.unit}</span>` : ''}<span class="note"></span></span>`;
  }
  if (f.type === 'sel') return `<span class="fw" data-w="${f.id}"><select class="sel" data-fid="${f.id}" aria-label="keuze ${f.id}"><option value="">…</option>${f.options.map((o, i) => `<option value="${i}">${o}</option>`).join('')}</select><span class="note"></span></span>`;
  if (f.type === 'choice') {
    const fig = f.grid ? ' has-fig' : '';
    return `<div class="opts${f.grid ? ' g2' : ''}" data-w="${f.id}" data-fid="${f.id}" role="radiogroup">${f.options.map((o, i) => `<label class="opt${fig}"><input type="radio" name="${uid}_${f.id}" value="${i}"><span class="ot">${o}</span></label>`).join('')}</div>`;
  }
  return `<div class="opts" data-w="${f.id}" data-fid="${f.id}" role="group">${f.options.map((o, i) => `<label class="opt"><input type="checkbox" name="${uid}_${f.id}" value="${i}"><span class="ot">${o}</span></label>`).join('')}</div>`;
}
function questionHTML(q, uid) {
  const placed = new Set();
  const html = q.prompt.replace(/\{\{(\w+)\}\}/g, (m, id) => { const f = q.fields.find(x => x.id === id); if (!f) return ''; placed.add(id); return fieldHTML(f, uid); });
  const rest = q.fields.filter(f => !placed.has(f.id)).map(f => `<div class="qrow">${fieldHTML(f, uid)}</div>`).join('');
  return html + (rest ? `<div class="qrows">${rest}</div>` : '');
}

/* ---- vraagonderdeel: lezen, markeren, vullen ---- */
function mountQuestion(host, q, opts = {}) {
  const uid = 'q' + (++_qid);
  const mode = opts.mode || 'practice';
  host.innerHTML = `<div class="qcard"><div class="qmeta">${opts.label ? `<span>${opts.label}</span>` : ''}<span class="tag">${q.tag}</span></div><div class="qprompt">${questionHTML(q, uid)}</div><div class="qactions"></div><div class="qfb" aria-live="polite"></div><div class="qsol"></div></div>`;
  const root = host.firstElementChild;
  const ctrl = { q, root, uid };
  const ctl = (f) => root.querySelector(`[data-fid="${f.id}"]`);
  ctrl.read = () => {
    const v = {};
    for (const f of q.fields) {
      if (f.type === 'num' || f.type === 'sel') v[f.id] = ctl(f).value;
      else if (f.type === 'choice') { const c = ctl(f).querySelector('input:checked'); v[f.id] = c ? c.value : ''; }
      else v[f.id] = Array.from(ctl(f).querySelectorAll('input:checked')).map(i => i.value);
    }
    return v;
  };
  ctrl.fill = (v) => {
    for (const f of q.fields) {
      const x = v[f.id]; if (x == null) continue;
      if (f.type === 'num' || f.type === 'sel') ctl(f).value = x;
      else if (f.type === 'choice') { const c = ctl(f).querySelector(`input[value="${x}"]`); if (c) c.checked = true; }
      else (x || []).forEach(val_ => { const c = ctl(f).querySelector(`input[value="${val_}"]`); if (c) c.checked = true; });
    }
    syncSel();
  };
  const syncSel = () => root.querySelectorAll('.opt').forEach(l => l.classList.toggle('sel', l.querySelector('input').checked));
  ctrl.clearMarks = (id) => {
    root.querySelectorAll(id ? `[data-w="${id}"]` : '[data-w]').forEach(w => { w.classList.remove('ok', 'bad'); const n = w.querySelector('.note'); if (n) n.textContent = ''; w.querySelectorAll('.opt').forEach(o => o.classList.remove('ok', 'bad', 'reveal')); });
  };
  ctrl.mark = (res) => {
    for (const f of q.fields) {
      const w = root.querySelector(`[data-w="${f.id}"]`), r = res[f.id]; if (!w || !r) continue;
      if (f.type === 'choice' || f.type === 'multi') {
        w.querySelectorAll('.opt').forEach(o => { const inp = o.querySelector('input'); if (!inp.checked) return; const good = f.type === 'multi' ? f.answer.includes(Number(inp.value)) : Number(inp.value) === f.answer; o.classList.add(good ? 'ok' : 'bad'); });
      } else {
        w.classList.toggle('ok', !!r.ok); w.classList.toggle('bad', !r.ok);
        const n = w.querySelector('.note'); if (n) n.innerHTML = r.near ? '<span class="near">Bijna: typ de exacte breuk, bv. 1/3</span>' : '';
      }
    }
  };
  ctrl.reveal = () => {
    for (const f of q.fields) {
      const w = root.querySelector(`[data-w="${f.id}"]`); if (!w) continue;
      if (f.type === 'choice') w.querySelectorAll('.opt').forEach((o, i) => { if (i === f.answer) o.classList.add('reveal'); });
      else if (f.type === 'multi') w.querySelectorAll('.opt').forEach((o, i) => { if (f.answer.includes(i)) o.classList.add('reveal'); });
      else if (!w.classList.contains('ok')) { const n = w.querySelector('.note'); if (n) n.innerHTML = `<span class="ans">juist: ${answerText(f)}</span>`; }
    }
  };
  ctrl.lock = () => root.querySelectorAll('input,select').forEach(e => { e.disabled = true; });
  ctrl.showSol = (open) => { root.querySelector('.qsol').innerHTML = `<details class="sol"${open ? ' open' : ''}><summary>Uitwerking</summary>${q.sol}</details>`; };
  ctrl.feedback = (html, cls) => { root.querySelector('.qfb').innerHTML = html ? `<div class="fb ${cls || ''}">${html}</div>` : ''; };
  ctrl.actions = root.querySelector('.qactions');
  root.addEventListener('change', e => { syncSel(); if (e.target.dataset && e.target.dataset.fid) ctrl.clearMarks(e.target.dataset.fid); else { const w = e.target.closest('[data-w]'); if (w) ctrl.clearMarks(w.dataset.w); } });
  root.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.fid) ctrl.clearMarks(e.target.dataset.fid); });
  return ctrl;
}

function pips(p, full) { let s = '<span class="pips" aria-hidden="true">'; for (let i = 0; i < MASTER; i++) { const w = full ? 100 : Math.max(0, Math.min(1, p - i)) * 100; s += `<u><s style="width:${w}%"></s></u>`; } return s + '</span>'; }
function renderLadder() {

    return `<li class="${cls.join(' ')}"><button type="button" data-go="rung" data-i="${i}" ${state.view === 'rung' && state.rung === i ? 'aria-current="step"' : ''}><span class="n">${done ? '✓' : r.n}</span><span class="t"><b>${r.short}</b><small>${pips(p, done)}<span>${r.mins} min</span></small></span></button></li>`;
  }).join('');

  const nd = Object.keys(store.done).filter(k => store.done[k]).length;
  $('overallTxt').textContent = `${nd} van ${RUNGS.length} sporten gehaald`;
  $('overallBar').style.width = (nd / RUNGS.length * 100) + '%';
}
function go(view, i) {
  state.view = view; if (i != null) state.rung = i;
  if (view === 'rung') { state.tab = (store.pts[state.rung] || store.done[state.rung]) ? 'practice' : 'learn'; state.qn = 0; state.lastKind = null; }
  if (view === 'toets') state.toets = null;
  if (view === 'rung' || view === 'toets') { store.last = { view, rung: state.rung }; saveStore(); }
  renderAll(true);
  $('ladder').classList.remove('open'); $('btnMenu').setAttribute('aria-expanded', 'false');
}
function renderAll(scroll) {
  renderLadder();
  const m = $('main');
  if (state.view === 'home') renderHome(m);
  else if (state.view === 'rung') renderRung(m);
  else if (state.view === 'toets') renderToets(m);
  else renderCheat(m);
  if (scroll) { try { window.scrollTo({ top: 0 }); } catch (e) { /* jsdom */ } }
}

<div class="row"><button class="btn primary" type="button" data-go="rung" data-i="${next < 0 ? 0 : next}">${next === 0 && !store.pts[0] ? 'Start met sport 1' : next < 0 ? 'Alles gehaald, oefen verder' : 'Ga verder met sport ' + (next + 1)}</button><button class="btn" type="button" data-go="toets">Naar de eindtoets</button><button class="btn ghost" type="button" data-go="cheat">Spiekbrief</button></div>
<div class="how"><div><b>1. Leer</b><span>Lees de uitleg en speel met de schuifjes.</span></div><div><b>2. Oefen</b><span>Typ je antwoord. Breuken typ je als 1/2. Decimalen met een komma mag.</span></div><div><b>3. Haal de sport</b><span>Juist zonder hulp telt 1, met hint een half. Bij 4 punten is de sport gehaald.</span></div><div><b>4. Eindtoets</b><span>${TOETS_PLAN.length} vragen zonder hints. Daarna zie je welke sporten je nog moet herhalen.</span></div></div></section>
<section class="panel"><h3 style="font-size:1.15rem;margin-bottom:6px">Wat staat er niet in?</h3><p style="margin:0;color:var(--muted)">De discriminant, ontbinden en vierkantsvergelijkingen oplossen met een formule horen niet bij dit hoofdstuk. Nulwaarden vind je hier door af te lezen op de grafiek of door uit de α-β-vorm (x ${MIN} α)² vrij te maken.</p></section>`;
}

/* ---- sport ---- */
function renderRung(m) {
  const r = RUNGS[state.rung], p = store.pts[state.rung] || 0, done = !!store.done[state.rung];
  m.innerHTML = `<section class="panel"><div class="rung-head"><div><p class="eyebrow">Sport ${r.n} van ${RUNGS.length}</p><h2>${r.title}</h2></div><div class="chips"><span class="chip">ongeveer ${r.mins} min</span>${done ? '<span class="chip" style="color:var(--ok);border-color:var(--ok)">gehaald</span>' : ''}</div></div><ul class="learn-list">${r.learn.map(l => `<li>${l}</li>`).join('')}</ul>
<div class="tabs" role="tablist"><button class="tab" role="tab" id="tabL" aria-selected="${state.tab === 'learn'}" data-tab="learn">1 · Leer</button><button class="tab" role="tab" id="tabP" aria-selected="${state.tab === 'practice'}" data-tab="practice">2 · Oefen</button></div>
<div id="tabBody"></div></section>`;
  renderTab();
}
function renderTab() {
  const r = RUNGS[state.rung], body = $('tabBody');
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)));
  if (state.tab === 'learn') {
    body.innerHTML = `<div class="theory">${r.theory()}</div><div class="row" style="margin-top:22px"><button class="btn primary" type="button" data-tab="practice">Ik snap het, ga oefenen →</button>${state.rung > 0 ? `<button class="btn ghost" type="button" data-go="rung" data-i="${state.rung - 1}">← vorige sport</button>` : ''}</div>`;
    body.querySelectorAll('[data-explorer]').forEach(mountExplorer);
  } else {
    const p = store.pts[state.rung] || 0, dn = !!store.done[state.rung];
    body.innerHTML = `<div class="mastery"><span><b>Voortgang sport ${r.n}</b></span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${MASTER}" aria-valuenow="${Math.min(p, MASTER)}"><i id="mBar" style="width:${dn ? 100 : Math.min(p, MASTER) / MASTER * 100}%"></i></div><span id="mTxt">${dn ? 'gehaald' : Math.min(p, MASTER).toLocaleString('nl-BE') + ' / ' + MASTER + ' punten'}</span></div><div id="banner"></div><div id="qhost"></div>`;
    nextQuestion();
  }
}
function updateMastery() {
  const p = store.pts[state.rung] || 0, dn = !!store.done[state.rung];
  const b = $('mBar'); if (b) { b.style.width = (dn ? 100 : Math.min(p, MASTER) / MASTER * 100) + '%'; b.parentElement.setAttribute('aria-valuenow', String(Math.min(p, MASTER))); }
  const t = $('mTxt'); if (t) t.textContent = dn ? 'gehaald' : Math.min(p, MASTER).toLocaleString('nl-BE') + ' / ' + MASTER + ' punten';
  renderLadder();
}
function award(outcome) {
  const d = { clean: 1, assisted: .5, failed: -.5 }[outcome];
  const i = state.rung; store.pts[i] = Math.max(0, (store.pts[i] || 0) + d);
  let just = false;
  if (store.pts[i] >= MASTER && !store.done[i]) { store.done[i] = true; just = true; }
  saveStore(); return just;
}
function nextQuestion() {
  const host = $('qhost'); if (!host) return;
  const q = makeQ(state.rung, state.lastKind);
  state.lastKind = q.kind; state.qn++; state.attempts = 0; state.hints = 0; state.done = false;
  const ctrl = mountQuestion(host, q, { mode: 'practice', label: 'Vraag ' + state.qn });
  state.ctrl = ctrl;
  const a = ctrl.actions;
  a.innerHTML = `<button class="btn primary" type="button" data-act="check">Controleer</button><button class="btn" type="button" data-act="hint">Hint</button><button class="btn ghost" type="button" data-act="sol">Toon uitwerking</button>`;
  const first = ctrl.root.querySelector('input:not([type=radio]):not([type=checkbox]),select'); if (first && !('ontouchstart' in window)) { try { first.focus({ preventScroll: true }); } catch (e) { /* */ } }
}
function finishQ(outcome) {
  const ctrl = state.ctrl; state.done = true; ctrl.lock();
  const just = award(outcome);
  updateMastery();
  ctrl.actions.innerHTML = `<button class="btn primary" type="button" data-act="next">Volgende vraag →</button>`;
  const nb = ctrl.actions.querySelector('[data-act=next]'); try { nb.focus({ preventScroll: true }); } catch (e) { /* */ }
  if (just) {
    const nxt = state.rung + 1;
    $('banner').innerHTML = `<div class="banner"><div><b>Sport ${RUNGS[state.rung].n} gehaald.</b><br><span style="font-size:.93rem">${nxt < RUNGS.length ? 'Klaar voor de volgende?' : 'Alle sporten gehaald. Probeer de eindtoets.'}</span></div><div class="row">${nxt < RUNGS.length ? `<button class="btn primary" type="button" data-go="rung" data-i="${nxt}">Naar sport ${nxt + 1}</button>` : `<button class="btn primary" type="button" data-go="toets">Naar de eindtoets</button>`}<button class="btn ghost" type="button" data-act="stay">Nog even oefenen</button></div></div>`;
  }
}
const PRAISE = ['Juist!', 'Klopt.', 'Goed gedaan.', 'Precies.', 'Top.'];
function onCheck() {
  const ctrl = state.ctrl; if (!ctrl || state.done) return;
  const q = ctrl.q, v = ctrl.read();
  const incomplete = q.fields.filter(f => { const r = gradeField(f, v[f.id]); return r.empty || (f.type === 'num' && r.msg && !r.ok && r.near !== true && parseNum(v[f.id]) === null); });
  if (incomplete.length) {
    const bad = incomplete.filter(f => f.type === 'num' && String(v[f.id]).trim() !== '');
    ctrl.feedback(bad.length ? '<b class="h">Dit is geen getal.</b>Typ bijvoorbeeld 3, -2,5 of 1/2.' : 'Vul eerst alle vakjes in.', 'hint'); return;
  }
  const g = gradeQ(q, v);
  if (g.ok) {
    ctrl.mark(g.res);
    const outcome = (state.attempts === 0 && state.hints === 0) ? 'clean' : 'assisted';
    ctrl.feedback(`<b class="h">${pick(PRAISE)}</b>${outcome === 'clean' ? 'Zonder hulp: +1 punt.' : 'Met hulp of een tweede poging: +½ punt.'}`, 'ok');
    ctrl.showSol(false); finishQ(outcome);
  } else {
    state.attempts++; ctrl.mark(g.res);
    const n = q.fields.length, k = q.fields.filter(f => g.res[f.id].ok).length;
    const near = q.fields.some(f => g.res[f.id].near);
    let msg = n === 1 ? '<b class="h">Nog niet juist.</b>Kijk nog eens goed en probeer opnieuw.' : `<b class="h">Nog niet helemaal.</b>${k} van de ${n} antwoorden kloppen. De rode vakjes moeten nog anders.`;
    if (near) msg += ' Je ligt dichtbij. Typ het exacte antwoord als breuk, bv. 1/3.';
    if (state.attempts >= 2 && state.hints === 0) msg += ' Een hint kan helpen.';
    ctrl.feedback(msg, 'bad');
  }
}
function onHint() {
  const ctrl = state.ctrl; if (!ctrl || state.done) return;
  const hs = ctrl.q.hints; if (!hs.length) return;
  state.hints = Math.min(state.hints + 1, hs.length);
  ctrl.root.querySelector('.qfb').innerHTML = hs.slice(0, state.hints).map((h, i) => `<div class="fb hint"><b class="h">Hint ${i + 1}</b>${h}</div>`).join('');
}
function onSol() {
  const ctrl = state.ctrl; if (!ctrl || state.done) return;
  const g = gradeQ(ctrl.q, ctrl.read());
  ctrl.mark(g.res); ctrl.reveal(); ctrl.showSol(true);
  ctrl.feedback('<b class="h">Zo kan het.</b>Lees de uitwerking en probeer het in je eigen woorden. Je krijgt zo een nieuwe vraag van dit type.', 'bad');
  finishQ('failed');
}

/* ---- eindtoets ---- */
function renderToets(m) {
  const t = state.toets;
  if (!t) {
    const b = store.best;
    m.innerHTML = `<section class="panel"><p class="eyebrow">Eindtoets</p><h2 style="font-size:1.9rem">Toets jezelf</h2><p class="lead" style="color:var(--muted);max-width:40em;margin-top:8px">${TOETS_PLAN.length} vragen uit alle sporten, in dezelfde stijl als de oefeningen. Geen hints en geen uitwerking tijdens de toets. Eén kans per vraag. Rekenen op papier mag. Op het einde zie je wat juist was en wat je nog moet herhalen.</p>${b ? `<p>Je beste score: <b>${b.score} / ${b.total}</b> (${b.pct}%).</p>` : ''}<div class="row"><button class="btn primary" type="button" data-act="toetsStart">Start de toets</button></div></section>`;
    return;
  }
  if (t.i >= t.qs.length) { renderToetsResult(m); return; }
  const q = t.qs[t.i];
  m.innerHTML = `<section class="panel"><div class="mastery"><span><b>Vraag ${t.i + 1} van ${t.qs.length}</b></span><div class="bar"><i style="width:${t.i / t.qs.length * 100}%"></i></div></div><div id="qhost"></div></section>`;
  const ctrl = mountQuestion($('qhost'), q, { mode: 'toets', label: 'Vraag ' + (t.i + 1) });
  state.ctrl = ctrl;
  ctrl.actions.innerHTML = `<button class="btn primary" type="button" data-act="toetsNext">${t.i + 1 < t.qs.length ? 'Bevestig en volgende →' : 'Bevestig en rond af'}</button>`;
}
function toetsStart() {
  const qs = []; let prev = {};
  for (const ri of TOETS_PLAN) { const q = makeQ(ri, prev[ri]); prev[ri] = q.kind; qs.push(q); }
  state.toets = { qs, i: 0, vals: [], t0: Date.now() };
  renderAll(true);
}
function toetsNext() {
  const t = state.toets, ctrl = state.ctrl; if (!t || !ctrl) return;
  t.vals[t.i] = ctrl.read(); t.i++;
  renderAll(true);
}
function renderToetsResult(m) {
  const t = state.toets;
  const results = t.qs.map((q, i) => gradeQ(q, t.vals[i] || {}));
  const score = results.filter(r => r.ok).length, total = t.qs.length, pct = Math.round(score / total * 100);
  if (!store.best || pct >= store.best.pct) store.best = { score, total, pct }; saveStore(); renderLadder();
  const per = RUNGS.map((r, i) => { const idx = t.qs.map((q, k) => q.rung === i ? k : -1).filter(k => k >= 0); const ok = idx.filter(k => results[k].ok).length; return { i, r, ok, n: idx.length }; }).filter(x => x.n > 0);
  const weak = per.filter(x => x.ok / x.n < .6);
  const msg = pct >= 80 ? 'Sterk. Je bent klaar voor de toets.' : pct >= 60 ? 'Bijna. Herhaal de sporten hieronder en probeer opnieuw.' : 'Nog wat werk. Oefen de sporten hieronder en probeer de toets daarna opnieuw.';
  m.innerHTML = `<section class="panel"><p class="eyebrow">Resultaat eindtoets</p><div class="row" style="align-items:flex-end;gap:18px"><div class="score">${score} / ${total}</div><div style="padding-bottom:4px"><b style="font-size:1.2rem">${pct}%</b><br><span style="color:var(--muted)">${msg}</span></div></div>
<div class="breakdown" aria-label="Score per sport">${per.map(x => { const p = x.ok / x.n; return `<div class="bd"><span>${x.r.n}. ${x.r.short}</span><div class="bar"><i class="${p >= .8 ? 'hi' : p >= .5 ? 'mid' : 'low'}" style="width:${Math.max(4, p * 100)}%"></i></div><span style="font-variant-numeric:tabular-nums">${x.ok}/${x.n}</span></div>`; }).join('')}</div>
${weak.length ? `<p><b>Herhaal:</b></p><div class="row">${weak.map(x => `<button class="btn small" type="button" data-go="rung" data-i="${x.i}">Sport ${x.r.n} · ${x.r.short}</button>`).join('')}</div>` : '<p>Geen zwakke sporten. Mooi werk.</p>'}
<div class="row" style="margin-top:14px"><button class="btn primary" type="button" data-act="toetsStart">Nieuwe toets</button></div></section>
<section class="panel"><h3 style="font-size:1.2rem">Nakijken</h3><p style="color:var(--muted);margin-top:4px">Klik een vraag open om je antwoord en de uitwerking te zien.</p>${t.qs.map((q, i) => `<details class="review-item" data-i="${i}"><summary><span class="st ${results[i].ok ? 'ok' : 'bad'}">${results[i].ok ? '✓' : '✗'}</span><span>Vraag ${i + 1} · ${q.tag}</span></summary><div class="rv"></div></details>`).join('')}</section>`;
  m.querySelectorAll('.review-item').forEach(d => d.addEventListener('toggle', () => {
    if (!d.open || d.dataset.ready) return; d.dataset.ready = '1';
    const i = Number(d.dataset.i), q = t.qs[i];
    const c = mountQuestion(d.querySelector('.rv'), q, { mode: 'review', label: 'Vraag ' + (i + 1) });
    c.fill(t.vals[i] || {}); c.mark(results[i].res); c.lock(); c.reveal(); c.showSol(true); c.actions.innerHTML = '';
  }));
}

/* ---- spiekbrief ---- */
function renderCheat(m) { m.innerHTML = `<section class="panel"><p class="eyebrow">Spiekbrief</p><h2 style="font-size:1.9rem;margin-bottom:14px">Alle formules van hoofdstuk 2</h2>${cheatSheet()}</section>`; }

/* ---- gebeurtenissen ---- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.go) { go(t.dataset.go, t.dataset.i != null ? Number(t.dataset.i) : null); return; }
  if (t.dataset.tab) { state.tab = t.dataset.tab; state.qn = 0; state.lastKind = null; renderTab(); return; }
  const a = t.dataset.act;
  if (a === 'check') onCheck(); else if (a === 'hint') onHint(); else if (a === 'sol') onSol();
  else if (a === 'next') { $('banner').innerHTML = ''; nextQuestion(); const h = $('qhost'); try { h.scrollIntoView({ block: 'nearest' }); } catch (er) { /* */ } }
  else if (a === 'stay') $('banner').innerHTML = '';
  else if (a === 'toetsStart') toetsStart(); else if (a === 'toetsNext') toetsNext();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
  if (!e.target.closest('.qcard')) return;
  if (state.view === 'rung') { e.preventDefault(); if (state.done) { const b = document.querySelector('[data-act=next]'); if (b) b.click(); } else onCheck(); }
  else if (state.view === 'toets' && state.toets) { e.preventDefault(); toetsNext(); }
});
$('btnMenu').addEventListener('click', () => { const l = $('ladder'); const o = l.classList.toggle('open'); $('btnMenu').setAttribute('aria-expanded', String(o)); });

/* ---- testhaken ---- */
Object.assign(PL, { RUNGS, makeQ, gradeQ, gradeField, mountQuestion, state, store, go, toetsStart, TOETS_PLAN, fmtF, abHTML, stdHTML, evalAB, evalStd, abToStd, stdToAB, fq, val, F, rand, mountExplorer, cheatSheet, parseNum, answerText });

/* ---- start ---- */
loadStore();
state.view = 'home';
renderAll(false);


})();
</script>
